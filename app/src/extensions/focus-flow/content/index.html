<!DOCTYPE html>

<title>Focus Flow</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface2:#eff1f5;--text:#1b1d22;--muted:#5f6b76;--line:#e3e6eb;
  --accent:#3f51b5;--on-accent:#fff;--accent-soft:#e8eaf8;
  --focus:#d6363b;--short:#0b7d70;--long:#4b4bc4;--on-ph:#fff;
  --good:#1e7d4f;--good-soft:#e3f5ec;--bad:#c62828;--bad-soft:#fdecec;--warn:#9a5b00;--warn-soft:#fff3dd;
  --orbit:#e6e8ee;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --radius:16px;--nav:64px;--ph:var(--focus)
}
html[data-theme="dark"]{
  --bg:#121417;--surface:#1d2025;--surface2:#262a31;--text:#e6e9ee;--muted:#a3adb8;--line:#30353d;
  --accent:#9fa8ff;--on-accent:#11131a;--accent-soft:#2a2f4d;
  --focus:#ff7b72;--short:#4fd8c4;--long:#a8abff;--on-ph:#141519;
  --good:#5fd39a;--good-soft:#193528;--bad:#ff8a80;--bad-soft:#3d2020;--warn:#ffc15e;--warn-soft:#3a2e17;
  --orbit:#2b3038;--shadow:none
}
body.ph-short{--ph:var(--short)} body.ph-long{--ph:var(--long)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Roboto,sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
main{padding:12px 16px 24px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.center{text-align:center}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;font-weight:600}
h3{margin:0;font-size:16px}
.icon-btn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer}
.btn{border:0;border-radius:12px;min-height:44px;padding:0 16px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.good{background:var(--good-soft);color:var(--good)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;min-height:36px;cursor:pointer;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:40px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;padding:0 4px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}.empty .e{font-size:40px}
.note{border-radius:14px;padding:12px;font-size:13px;background:var(--surface2);margin-bottom:12px}
.note.warn{background:var(--warn-soft);color:var(--text)}.note.good{background:var(--good-soft);color:var(--text)}
/* ---- timer ---- */
.topline{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.today{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.today b{color:var(--text)}
.phase-seg button.on{color:var(--ph)}
.dial{position:relative;width:min(320px,86vw);aspect-ratio:1;margin:2px auto 6px}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dial .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.clock{font-size:clamp(46px,15vw,62px);font-weight:300;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.phase-name{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ph);margin-bottom:6px}
.under{font-size:12px;color:var(--muted);margin-top:8px}
.track{fill:none;stroke:var(--orbit)}
.prog{fill:none;stroke:var(--ph);stroke-linecap:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ph) 45%,transparent));transition:stroke-dashoffset .3s linear}
.arc{fill:none;stroke-linecap:round;stroke-width:8}
.arc.done{stroke:var(--focus)}.arc.cut{stroke:color-mix(in srgb,var(--focus) 40%,var(--orbit))}
.arc.live{stroke:var(--focus);opacity:.55;stroke-dasharray:2 4}
.tick{stroke:var(--muted);opacity:.45}
.hour{fill:var(--muted);font-size:10px;text-anchor:middle;dominant-baseline:middle}
.nowdot{fill:var(--text)}
.halo{fill:var(--ph);opacity:.3;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.5}to{transform:scale(2.2);opacity:0}}
.beads{display:flex;justify-content:center;gap:8px;margin:2px 0 14px}
.bead{width:12px;height:12px;border-radius:50%;border:2px solid var(--focus);opacity:.9}
.bead.full{background:var(--focus)}
.bead.now{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.35)}}
.controls{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:14px}
.round{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.go{width:84px;height:84px;border-radius:50%;border:0;background:var(--ph);color:var(--on-ph);font-size:30px;cursor:pointer;box-shadow:0 6px 20px color-mix(in srgb,var(--ph) 35%,transparent);display:flex;align-items:center;justify-content:center}
.label-in{display:flex;gap:8px;align-items:center}
.label-in .input{flex:1}
.mini{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--a1,#5b6ee1),var(--a2,#b44fd0))}
.avatar img{width:100%;height:100%;object-fit:cover;background:#fff}
.avatar.big{width:72px;height:72px;border-radius:18px;font-size:34px}
/* ---- stats ---- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.3px}
.kpi .k{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;position:relative;padding-top:6px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .b{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--focus);min-height:2px}
.bars .b.zero{background:var(--orbit)}
.bars .d{font-size:10px;color:var(--muted);margin-top:4px;height:12px}
.goalline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6;pointer-events:none}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--orbit);display:block}
.heat i.l1{background:color-mix(in srgb,var(--focus) 30%,var(--orbit))}.heat i.l2{background:color-mix(in srgb,var(--focus) 55%,var(--orbit))}
.heat i.l3{background:color-mix(in srgb,var(--focus) 78%,var(--orbit))}.heat i.l4{background:var(--focus)}
.heat i.out{visibility:hidden}
.legend{display:flex;align-items:center;gap:3px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hours{display:flex;align-items:flex-end;gap:2px;height:70px}
.hours i{flex:1;background:var(--long);border-radius:3px 3px 1px 1px;min-height:2px;opacity:.85}
.hours i.zero{background:var(--orbit)}
.hlab{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.hbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.hbar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.list .item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);min-height:52px}
.list .item:first-child{border-top:0}
.list .item.tap{cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--focus)}.dot.cut{background:var(--orbit);border:2px solid var(--focus)}
.x{min-width:44px;min-height:44px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;border-radius:10px}
/* ---- challenges ---- */
.ch .count{font-size:34px;font-weight:300;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0}
.pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--short),var(--long));transition:width .4s}
.ch.ended{border-color:var(--warn)}
/* ---- radio ---- */
.now{display:flex;gap:14px;align-items:center}
.status{font-size:12px;font-weight:600}
.status.playing{color:var(--good)}.status.error{color:var(--bad)}.status.buffering{color:var(--warn)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:4px;vertical-align:-1px}
.eq i{width:3px;background:currentColor;animation:eq 1s ease-in-out infinite;border-radius:2px}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.vol{width:100%;accent-color:var(--accent);min-height:32px}
.star{min-width:44px;min-height:44px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.star.on{color:#f5b400}
.input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;outline:none}
.input:focus{border-color:var(--accent)}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* ---- nav ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button span{font-size:20px;line-height:1;padding:3px 14px;border-radius:99px;position:relative}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.on span{background:var(--accent-soft)}
nav.tabs .badge{position:absolute;top:-2px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--focus)}
/* ---- sheets: resting state = visible; keyframes only decorate ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fade-in .2s ease both}
.scrim.closing{animation:fade-out .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);max-height:calc(var(--vh,100vh) - 24px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;z-index:21;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:sheet-in .25s ease both;max-width:720px;margin:0 auto}
.sheet.closing{animation:sheet-out .22s ease both}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:18px;margin-bottom:8px}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheet-out{from{transform:none}to{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.stepper:first-of-type{border-top:0}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper .ctl .input{width:64px;text-align:center;min-height:44px;padding:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-top:1px solid var(--line)}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
/* ---- overlays ---- */
.oled{position:fixed;inset:0;background:#000;color:#c9cdd4;z-index:30;display:flex;align-items:center;justify-content:center;animation:fade-in .4s ease both}
.oled .box{text-align:center;transition:transform 2s ease}
.oled .clock{color:#e8eaee;font-size:clamp(64px,22vw,96px);font-weight:200}
.oled .phase-name{opacity:.8}
.oled .sub{font-size:13px;opacity:.55;margin-top:10px}
.oled .acts{display:flex;gap:14px;justify-content:center;margin-top:28px}
.oled .acts button{min-width:52px;min-height:52px;border-radius:50%;border:1px solid #2a2d33;background:#0b0c0e;color:#c9cdd4;font-size:20px;cursor:pointer}
.oled .exit{position:absolute;top:12px;right:12px;min-width:44px;min-height:44px;border-radius:12px;border:1px solid #2a2d33;background:#0b0c0e;color:#9aa1ab;font-size:18px;cursor:pointer}
.alarm{position:fixed;inset:0;z-index:35;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade-in .2s ease both}
.alarm .panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 18px;text-align:center;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.alarm .bell{font-size:56px;display:inline-block;animation:ring 1s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-18deg)}20%,40%{transform:rotate(18deg)}50%{transform:rotate(0)}}
.alarm h3{font-size:20px;margin:10px 0 4px;overflow-wrap:anywhere}
.countdown{position:fixed;inset:0;z-index:36;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;animation:fade-in .2s ease both}
.countdown .ready{font-size:15px;color:var(--muted)}
.countdown h3{font-size:20px;margin:0;max-width:92%;overflow-wrap:anywhere}
.cd-ring{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:8px 0 16px}
.cd-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.cd-ring .bg{fill:none;stroke:var(--orbit);stroke-width:10}
.cd-ring .fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;stroke-dasharray:283;animation:cd-drain 1s linear both}
.cd-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(88px,30vw,128px);font-weight:250;font-variant-numeric:tabular-nums;line-height:1;animation:cd-pop .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes cd-drain{from{stroke-dashoffset:0}to{stroke-dashoffset:283}}
@keyframes cd-pop{from{transform:scale(1.35);opacity:.2}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw;animation:fade-in .2s ease both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-size:22px;font-style:normal;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(var(--fall,700px)) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion: reduce){.countdown,.cd-ring .fg,.cd-num,.sheet,.scrim,.oled,.alarm,.halo,.bead.now,.alarm .bell,.eq i{animation:none}.prog{transition:none}}
[hidden]{display:none !important}
</style>

<script>
'use strict';
/* =====================================================================
   Focus Flow — Pomodoro, statistics, timed challenges and focus radio.
   - The timer runs on timestamps (endsAt), never on counted ticks: with the
     screen off it is still right when the page wakes up, and every phase that
     ended meanwhile is recorded at its real time.
   - Phase ends and challenge alarms are scheduled with OrthoTips.notifications,
     so Android notifies even with the screen off or the extension closed.
   - Radio: OrthoTips.media (bridge 5, permission `background`) plays in the
     app's media service — screen off, notification panel, lock screen. The
     service is the single source of truth: the page only mirrors its state.
     Older apps: an <audio> element in the page (stops when Android suspends it).
   ===================================================================== */
const HOST = window.OrthoTips || null;
const ID = 'focus-flow', KEY = ID + ':state', SCHEMA = 1;
const has = p => !HOST || !HOST.permissions || HOST.permissions.has(p);   // a plain browser has no permission system
const NOTIF = HOST && HOST.notifications && has('notifications') ? HOST.notifications : null;
const MEDIA = HOST && HOST.media && HOST.permissions && HOST.permissions.has('background') ? HOST.media : null;
const LANG = /^en/i.test(HOST ? HOST.language : (navigator.language || 'fr')) ? 'en' : 'fr';
document.documentElement.lang = LANG;
const now = () => Date.now();

/* ---------- texts ---------- */
const I18N = {
  fr:{

    oled:'Mode veille',settings:'Réglages',
    notifTitle:'🔔 Alertes écran éteint',notifText:'Autorisez les notifications pour être prévenu à la fin de chaque phase et de chaque défi, même écran éteint ou extension fermée.',
    notifAllow:'Autoriser',notifDenied:'Notifications refusées : activez-les dans les réglages Android d’Ortho Tips.',
    notifNone:'Cette version d’Ortho Tips ne gère pas les notifications : le minuteur reste exact, mais il ne peut pas sonner écran éteint.',
    focusDone:'🍅 Focus terminé',breakDone:'☕ Pause terminée',
    nBreakAuto:'Pause de {n} min commencée',nBreak:'Place à une pause de {n} min',
    nFocusAuto:'Focus de {n} min commencé',nFocus:'Prêt pour {n} min de focus ?',nCycle:'Cycle complet ! Relancez quand vous êtes prêt.',
    settingsTitle:'Réglages',focusMin:'Focus (min)',shortMin:'Pause courte (min)',longMin:'Pause longue (min)',every:'Pause longue toutes les',everyU:'sessions',
    goal:'Objectif quotidien',goalU:'sessions',autoBreak:'Démarrer les pauses automatiquement',autoFocus:'Enchaîner le focus après une pause courte',
    autoHint:'Après la pause longue, le minuteur attend toujours que vous relanciez : rien ne tourne indéfiniment.',

    badFile:'Ce fichier n’est pas une sauvegarde Focus Flow.',noExport:'Export impossible : permission « import_export » absente.',
    where:'Données enregistrées dans Ortho Tips, sur ce téléphone.',whereBrowser:'Données enregistrées dans ce navigateur.',
    readFail:'⚠️ Données illisibles : rien ne sera enregistré pour ne pas les écraser. Restaurez une sauvegarde.',

/* A challenge starts after a 5-second countdown: a beep each second, a higher

const CD_MS = 5000;
function startChallenge(title, ms){

}

  const c = chal(id); if(!c) return; const n = now();
  if(act === 'pause' && c.status === 'running'){ c.remaining = Math.max(0, c.endsAt - n); c.status = 'paused'; }
  else if(act === 'resume' && c.status === 'paused'){ c.endsAt = n + c.remaining; c.status = 'running'; }

function wantedReminders(){

      const title = s.phase === 'focus' ? t('focusDone') : t('breakDone');
      const body = s.phase === 'long' ? t('nCycle') : s.phase === 'focus' ? t(s.auto ? 'nBreakAuto' : 'nBreak', {n:nextMin}) : t(s.auto ? 'nFocusAuto' : 'nFocus', {n:nextMin});

    if(c.status !== 'running' && c.status !== 'countdown') continue;
    out.push({id:'chal:' + c.id, title:t('nChal'), body:c.title.slice(0, 300), at:c.endsAt, repeatDays:0, data:JSON.stringify({k:'chal', id:c.id}), exact:true});

    try{
      const st = await NOTIF.status(); ui.notif = !!st.granted;
      if(!st.granted) return;
      const want = wantedReminders();

        if(!h || h.at !== r.at || h.title !== r.title || h.body !== r.body || (h.data ?? null) !== r.data) await NOTIF.schedule(r);

  async load(stn, url){

/* ---------- stats view ---------- */
function rangeStart(){ return ui.range === 'all' ? 0 : addDays(dayStart(now()), -(ui.range - 1)); }
function streaks(){
  const days = new Set(state.sessions.filter(s => s.done).map(s => dayKey(s.start)));
  let cur = 0, d = dayStart(now());
  if(!days.has(dayKey(d))) d = addDays(d, -1);
  while(days.has(dayKey(d))){ cur++; d = addDays(d, -1); }
  const sorted = [...days].sort(); let best = 0, run = 0, prev = null;
  for(const k of sorted){ const ms = new Date(k + 'T12:00:00').getTime(); run = prev != null && Math.round((ms - prev) / 86400000) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = ms; }
  return {cur, best};
}
function viewStats(){
  if(!state.sessions.length) return `<div class="card empty"><div class="e">📊</div><h3>${esc(t('statsEmpty'))}</h3><p class="small">${esc(t('statsEmptyHint'))}</p></div>`;
  const r0 = rangeStart(), list = state.sessions.filter(s => s.start >= r0);
  const min = list.reduce((a, s) => a + s.min, 0), doneN = list.filter(s => s.done).length;
  const first = state.sessions.reduce((a, s) => Math.min(a, s.start), now());
  const spanDays = ui.range === 'all' ? Math.max(1, Math.round((dayStart(now()) - dayStart(first)) / 86400000) + 1) : ui.range;
  const rate = list.length ? Math.round(doneN / list.length * 100) : 0;
  const st = streaks();
  let html = `<div class="seg">${[[7,'r7'],[30,'r30'],['all','rAll']].map(([k, l]) => `<button data-act="range" data-range="${k}" class="${ui.range === k ? 'on' : ''}">${esc(t(l))}</button>`).join('')}</div>
  <div class="kpis">
    <div class="kpi"><div class="v num">${dur(min)}</div><div class="k">${esc(t('kFocus'))}</div></div>
    <div class="kpi"><div class="v num">${doneN}</div><div class="k">${esc(t('kSessions'))}</div></div>
    <div class="kpi"><div class="v num">🔥 ${esc(t('days', {n:st.cur}))}</div><div class="k">${esc(t('kStreak'))} · ${esc(t('best', {n:st.best}))}</div></div>
    <div class="kpi"><div class="v num">${rate} %</div><div class="k">${esc(t('kRate'))}</div></div>
  </div>`;
  // per day
  const nDays = ui.range === 'all' ? Math.min(30, spanDays) : ui.range; const today = dayStart(now());
  const perDay = Array.from({length:nDays}, (_, i) => { const d = addDays(today, i - nDays + 1); const k = dayKey(d); return {d, m:state.sessions.filter(s => dayKey(s.start) === k).reduce((a, s) => a + s.min, 0)}; });
  const goalMin = state.settings.goal * state.settings.focus; const top = Math.max(goalMin, ...perDay.map(x => x.m), 1);
  const wd = new Intl.DateTimeFormat(LOC, {weekday:'narrow'});
  html += `<h2>${esc(t('perDay'))}</h2><div class="card"><div class="small muted" style="margin-bottom:6px">${esc(t('avg', {d:dur(min / spanDays)}))}</div>
    <div class="bars"><div class="goalline" style="bottom:${(16 + goalMin / top * 108).toFixed(1)}px" title="${esc(t('goal'))}"></div>${perDay.map((x, i) =>
      `<div class="c" title="${esc(dateLabel(x.d) + ' · ' + dur(x.m))}"><div class="b ${x.m ? '' : 'zero'}" style="height:${(x.m / top * 108).toFixed(1)}px"></div><div class="d">${nDays <= 7 || (nDays - 1 - i) % 5 === 0 ? esc(nDays <= 7 ? wd.format(new Date(x.d)) : new Date(x.d).getDate()) : ''}</div></div>`).join('')}</div></div>`;
  // heatmap, weeks starting on Monday
  const weeks = 16; const dow = (new Date(today).getDay() + 6) % 7; const startHeat = addDays(today, -dow - (weeks - 1) * 7);
  const minsByDay = {}; for(const s of state.sessions) minsByDay[dayKey(s.start)] = (minsByDay[dayKey(s.start)] || 0) + s.min;
  const maxDay = Math.max(1, ...Object.values(minsByDay));
  const cells = Array.from({length:weeks * 7}, (_, i) => { const d = addDays(startHeat, i); if(d > today) return '<i class="out"></i>';
    const m = minsByDay[dayKey(d)] || 0; const lvl = m ? Math.min(4, 1 + Math.floor(m / maxDay * 3.999)) : 0; return `<i class="${lvl ? 'l' + lvl : ''}" title="${esc(dateLabel(d) + ' · ' + dur(m))}"></i>`; }).join('');
  html += `<h2>${esc(t('regularity'))}</h2><div class="card"><div class="heat">${cells}</div>
    <div class="legend">${esc(t('less'))} <i style="background:var(--orbit)"></i><i class="l1" style="background:color-mix(in srgb,var(--focus) 30%,var(--orbit))"></i><i style="background:color-mix(in srgb,var(--focus) 55%,var(--orbit))"></i><i style="background:color-mix(in srgb,var(--focus) 78%,var(--orbit))"></i><i style="background:var(--focus)"></i> ${esc(t('more'))}</div></div>`;
  // hours
  const hrs = Array(24).fill(0); for(const s of list){ let a = s.start; while(a < s.end){ const h = new Date(a).getHours(); const nextH = new Date(a); nextH.setMinutes(60, 0, 0); const b = Math.min(s.end, nextH.getTime()); hrs[h] += (b - a) / 60000 * (s.min / Math.max(1, (s.end - s.start) / 60000)); a = b; } }
  const hTop = Math.max(1, ...hrs); const bestH = hrs.indexOf(Math.max(...hrs));
  if(list.length) html += `<h2>${esc(t('bestHours'))}</h2><div class="card"><div class="small" style="margin-bottom:8px">⚡ ${esc(t('bestHour', {h:bestH + 'h–' + (bestH + 1) + 'h'}))}</div>
    <div class="hours">${hrs.map((m, h) => `<i class="${m ? '' : 'zero'}" style="height:${(m / hTop * 100).toFixed(1)}%" title="${h}h · ${esc(dur(m))}"></i>`).join('')}</div>
    <div class="hlab"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div></div>`;
  // labels
  const by = {}; for(const s of list){ const k = s.label || ''; by[k] = (by[k] || 0) + s.min; }
  const lab = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if(lab.length) html += `<h2>${esc(t('byLabel'))}</h2><div class="card">${lab.map(([k, m]) => `<div style="margin-bottom:10px"><div class="row between small"><span class="ellipsis grow">${esc(k || t('noLabel'))}</span><b class="num">${dur(m)}</b></div><div class="hbar"><i style="width:${(m / lab[0][1] * 100).toFixed(1)}%"></i></div></div>`).join('')}</div>`;
  // history
  const hist = [...list].sort((a, b) => b.start - a.start).slice(0, 60);
  if(hist.length) html += `<h2>${esc(t('history'))}</h2><div class="card list">${hist.map(s => `<div class="item"><i class="dot ${s.done ? '' : 'cut'}"></i>
      <div class="grow"><div class="ellipsis">${esc(s.label || t('noLabel'))}</div><div class="tiny muted">${esc(dateLabel(s.start))} · ${hm(s.start)}–${hm(s.end)}${s.done ? '' : ' · ' + esc(t('cut'))}</div></div>
      <b class="num small">${dur(s.min)}</b><button class="x" data-act="delSession" data-id="${esc(s.id)}" aria-label="✕">✕</button></div>`).join('')}</div>`;
  return html;
}

  const s = state.settings;
  const sh = openSheet(`<h3>${esc(t('settingsTitle'))}</h3>
    ${STEPS.map(([k, l, , , st]) => `<div class="stepper"><label class="small" for="set-${k}">${esc(t(l))}${k === 'every' ? ' (' + esc(t('everyU')) + ')' : k === 'goal' ? ' (' + esc(t('goalU')) + ')' : ''}</label>
      <div class="ctl"><button class="icon-btn" type="button" data-step="${k}" data-d="-${st}" aria-label="−">−</button><input class="input num" id="set-${k}" name="${k}" type="number" inputmode="numeric" value="${s[k]}"><button class="icon-btn" type="button" data-step="${k}" data-d="${st}" aria-label="+">+</button></div></div>`).join('')}
    ${[['autoBreak','autoBreak'],['autoFocus','autoFocus'],['sound','sound'],['vibrate','vibrate']].concat(NOTIF ? [['notify','notify']] : []).map(([k, l]) =>
      `<label class="switch"><span class="small">${esc(t(l))}</span><input type="checkbox" name="${k}" ${s[k] ? 'checked' : ''}></label>`).join('')}
    <div class="hint">${esc(t('autoHint'))}</div>
    <h2>${esc(t('backup'))}</h2>
    <button class="btn block" data-do="export">💾 ${esc(t('exportJson'))}</button>
    <button class="btn ghost block" data-do="import" style="margin-top:8px">📂 ${esc(t('importJson'))}</button>
    <input type="file" accept="application/json,.json" hidden data-file>
    <p class="tiny muted">${esc(HOST ? t('where') : t('whereBrowser'))}</p>`);
  const setNum = (k, v) => { const def = STEPS.find(x => x[0] === k); const val = clamp(Math.round(Number(v) || def[2]), def[2], def[3]); s[k] = val; sh.querySelector(`[name="${k}"]`).value = val; applySettings(); };
  sh.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.step) setNum(b.dataset.step, s[b.dataset.step] + Number(b.dataset.d));
    else if(b.dataset.do === 'export') exportBackup();
    else if(b.dataset.do === 'import') sh.querySelector('[data-file]').click();
  });
  sh.addEventListener('change', e => {
    const el = e.target;
    if(el.type === 'checkbox'){ s[el.name] = el.checked; applySettings(); }
    else if(el.type === 'number') setNum(el.name, el.value);
    else if(el.matches('[data-file]')) importBackup(el);
  });
}
/* New durations apply at once to an idle timer, to the next phases otherwise. */
function applySettings(){
  const tm = state.timer;
  if(tm.status === 'idle'){ tm.dur = phaseMs(tm.phase); tm.remaining = tm.dur; }
  save(); render(); syncReminders();
}
async function exportBackup(){
  const name = 'focus-flow-' + dayKey(now()) + '.json';
  const json = JSON.stringify({app:ID, v:SCHEMA, date:new Date().toISOString(), data:state}, null, 1);
  if(HOST){ if(!has('import_export')){ toast(t('noExport')); return; } if(await HOST.saveFile(name, json, 'application/json')) toast(t('saved')); return; }
  const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  const a = Object.assign(document.createElement('a'), {href:url, download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function importBackup(input){
  const f = input.files && input.files[0]; input.value = ''; if(!f) return;
  try{
    const raw = JSON.parse(await f.text());
    if(!raw || raw.app !== ID || !raw.data || typeof raw.data !== 'object' || !Array.isArray(raw.data.sessions)) throw new Error('format');
    state = migrate(raw.data); loadFailed = false; flush(); closeAllSheets(); render(); syncReminders(); toast(t('restored'));
  }catch(e){ alert(t('badFile')); }
}

/* ---------- overlays: standby (OLED) and challenge alarm ---------- */
let oledShift = null;
function renderOverlays(){
  // standby
  let o = $('#oled');
  if(ui.oled){
    const tm = state.timer, s = Player.station(), on = Player.st.status === 'playing' || Player.st.status === 'buffering';
    if(!o){ o = document.createElement('div'); o.id = 'oled'; o.className = 'oled'; document.body.append(o);
      oledShift = setInterval(() => { const b = $('#oled .box'); if(b) b.style.transform = `translate(${Math.round(Math.random() * 40 - 20)}px,${Math.round(Math.random() * 60 - 30)}px)`; }, 60000); }
    o.innerHTML = `<button class="exit" data-act="oledExit" aria-label="✕">✕</button><div class="box">
      <div class="phase-name">${esc(t(tm.phase))}</div><div class="clock" id="oledClock">${clock(tm.status === 'running' ? tm.endsAt - now() : tm.remaining)}</div>
      <div class="sub">🍅 ${todayDone()} / ${state.settings.goal}${s ? ' · 📻 ' + esc(s.name) : ''}</div>
      <div class="acts"><button data-act="go" aria-label="${esc(tm.status === 'running' ? t('pause') : t('start'))}">${tm.status === 'running' ? '⏸' : '▶'}</button>
      ${s ? `<button data-act="radioToggle" aria-label="📻">${on ? '🔇' : '📻'}</button>` : ''}</div>
      <div class="sub">${esc(t('oledHint'))}</div></div>`;
  }else if(o){ o.remove(); clearInterval(oledShift); oledShift = null; }
  // 5-second countdown before a challenge
  let cd = $('#countdown'); const cc = countingDown();
  if(cc){
    const left = clamp(Math.ceil((cc.goAt - now()) / 1000), 1, 5);
    if(!cd){ cd = document.createElement('div'); cd.id = 'countdown'; cd.className = 'countdown'; cd.setAttribute('role', 'alertdialog'); document.body.append(cd); }
    if(cd.dataset.n !== left + ':' + cc.id){
      cd.dataset.n = left + ':' + cc.id;
      cd.innerHTML = `<div class="ready">${esc(t('getReady'))}</div><h3>${esc(cc.title)}</h3>
        <div class="cd-ring" aria-live="assertive"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" cx="50" cy="50" r="45"/></svg><div class="cd-num num">${left}</div></div>
        <div class="tiny muted">${esc(dur(cc.dur / 60000))}</div>
        <button class="btn ghost" data-act="cdCancel" data-id="${esc(cc.id)}" style="min-width:160px">${esc(t('cdCancel'))}</button>`;
    }
  }else if(cd) cd.remove();
  // alarm
  let a = $('#alarm'); const c = ui.alarmFor ? chal(ui.alarmFor) : null;
  if(c && c.status === 'ended'){
    if(!a){ a = document.createElement('div'); a.id = 'alarm'; a.className = 'alarm'; a.setAttribute('role', 'alertdialog'); document.body.append(a); }
    a.innerHTML = `<div class="panel"><div class="bell">⏰</div><div class="tiny muted">${esc(t('timeUp'))}</div><h3>${esc(c.title)}</h3>
      <p class="small muted">${esc(t('didIt'))}</p>
      <div class="btns"><button class="btn good" data-act="chal" data-do="won" data-id="${c.id}">${esc(t('done'))}</button><button class="btn danger" data-act="chal" data-do="lost" data-id="${c.id}">${esc(t('notDone'))}</button></div>
      <div class="btns"><button class="btn ghost" data-act="chal" data-do="plus5" data-id="${c.id}">${esc(t('plus5'))}</button>${alarmLoop ? `<button class="btn ghost" data-act="mute">🔕 ${esc(t('stopSound'))}</button>` : ''}</div></div>`;
  }else{ if(a) a.remove(); if(ui.alarmFor && (!c || c.status !== 'ended')){ ui.alarmFor = null; stopAlarmSound(); } }
}
function dismissAlarm(){ if(ui.alarmFor){ ui.dismissed.add(ui.alarmFor); ui.alarmFor = null; stopAlarmSound(); render(); return true; } return false; }

/* ---------- sheets (keyboard-safe, Back aware) ---------- */
function openSheet(html){
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sheet = document.createElement('div'); sheet.className = 'sheet'; sheet.setAttribute('role', 'dialog');
  sheet.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(scrim, sheet); ui.sheets.push({scrim, sheet});
  scrim.addEventListener('click', closeSheet);
  // No automatic focus: let the user tap; then bring the field into view.
  sheet.addEventListener('focusin', e => {
    const f = e.target; if(!f.matches || !f.matches('input,select,textarea')) return;
    setTimeout(() => { fitViewport(); f.scrollIntoView({block:'center', behavior:'smooth'}); }, 320);
  });
  return sheet;
}
function closeSheet(){
  const e = ui.sheets.pop(); if(!e) return false;
  if(document.activeElement && e.sheet.contains(document.activeElement)) document.activeElement.blur();
  e.scrim.classList.add('closing'); e.sheet.classList.add('closing');
  setTimeout(() => { e.scrim.remove(); e.sheet.remove(); }, 230);
  return true;
}
function closeAllSheets(){ while(ui.sheets.length) closeSheet(); }
function fitViewport(){
  const root = document.documentElement.style, vv = window.visualViewport;
  const visible = vv ? vv.height : window.innerHeight;
  const kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  root.setProperty('--vh', visible + 'px'); root.setProperty('--kb', kb + 'px');
}
if(window.visualViewport){ visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }
window.addEventListener('resize', fitViewport); fitViewport();

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if(tab){ ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act = b.dataset.act;
  switch(act){
    case 'go': state.timer.status === 'running' ? pauseTimer() : startTimer(); break;
    case 'reset': resetTimer(); break;
    case 'skip': skipPhase(); break;
    case 'phase': if(b.dataset.phase !== state.timer.phase && state.timer.status !== 'running'){ recordCut(now()); setPhase(b.dataset.phase); } break;
    case 'useLabel': state.timer.label = b.dataset.label; changed(); break;
    case 'settings': settingsSheet(); break;
    case 'oled': ui.oled = true; renderOverlays(); break;
    case 'oledExit': ui.oled = false; renderOverlays(); break;
    case 'askNotif': askNotif(); break;
    case 'range': ui.range = b.dataset.range === 'all' ? 'all' : Number(b.dataset.range); render(); break;
    case 'delSession': if(confirm(t('delSession'))){ state.sessions = state.sessions.filter(s => s.id !== b.dataset.id); save(); render(); toast(t('deleted')); } break;
    case 'newChal': chalSheet(); break;
    case 'chal': chalAct(b.dataset.id, b.dataset.do); break;
    case 'cdCancel': cancelCountdown(b.dataset.id); break;
    case 'mute': stopAlarmSound(); renderOverlays(); break;
    case 'toRadio': if(!e.target.closest('[data-act="radioToggle"]')){ ui.tab = 'radio'; render(); } break;
    case 'radioToggle': Player.toggle(); break;
    case 'radioStop': Player.stop(); break;
    case 'radioTab': ui.radioTab = b.dataset.rt; ui.results = null; ui.searchErr = ''; ui.genre = '';
      if(ui.radioTab === 'dz') searchRadio({countrycode:'DZ'}); else render(); break;
    case 'genre': ui.genre = b.dataset.g; ui.query = ''; searchRadio({tag:b.dataset.g}); break;
    case 'playStation': if(!e.target.closest('[data-act="fav"]')){ const s = findStation(b.dataset.id); if(s) Player.play(s); } break;
    case 'fav': toggleFav(b.dataset.id); break;
    case 'addStation': addStationSheet(); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.dataset.form === 'search'){ const q = $('#q').value.trim(); ui.query = q; ui.genre = ''; if(q) searchRadio({name:q}); }
});
document.addEventListener('input', e => {
  if(e.target.id === 'label'){ state.timer.label = e.target.value.slice(0, 60); save(); }
  if(e.target.id === 'vol') Player.setVolume(Number(e.target.value));
});
document.addEventListener('change', e => { if(e.target.id === 'label'){ rememberLabel(e.target.value); save(); } });
document.addEventListener('error', e => {   // a station logo that does not load: show its letter
  const img = e.target; if(img && img.tagName === 'IMG' && img.dataset.fallback != null){ const p = img.parentElement; img.remove(); if(p) p.textContent = img.dataset.fallback; }
}, true);

/* ---------- Back: alarm, sheet, standby, then the timer, then leave ---------- */
function onBack(){
  const cc = countingDown(); if(cc) return cancelCountdown(cc.id);
  if(ui.alarmFor) return dismissAlarm();
  if(ui.sheets.length){ closeSheet(); return true; }
  if(ui.oled){ ui.oled = false; renderOverlays(); return true; }
  if(ui.tab !== 'timer'){ ui.tab = 'timer'; render(); return true; }
  return false;
}
if(HOST) HOST.onBack(onBack);

/* ---------- the clock ---------- */
function tick(){
  const n = now();
  const a = advance(n, !document.hidden), c = tickChallenges(n, !document.hidden);
  countdownTick(n, !document.hidden);
  if(a || c){ render(); syncReminders(); }
  else live();
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flush();
  else{ tick(); syncReminders(); }
});
window.addEventListener('pagehide', flush);

/* ---------- start ---------- */
(function start(){
  const n = now();
  advance(n, false); tickChallenges(n, false);
  // Opened from a notification, or one tapped while open.
  if(NOTIF && NOTIF.launch) onNotificationOpen(NOTIF.launch);
  if(NOTIF) NOTIF.onOpen(onNotificationOpen);
  // A challenge that ended while we were away asks for its verdict.
  if(!ui.alarmFor){ const e = state.challenges.find(c => c.status === 'ended'); if(e) ui.alarmFor = e.id; }
  if(MEDIA){ MEDIA.onChange(s => Player.apply(s)); MEDIA.state().then(s => Player.apply(s)).catch(() => {}); }
  render();
  syncReminders().then(() => { if(ui.notif === false) render(); });
  setInterval(tick, 250);
})();
</script>
