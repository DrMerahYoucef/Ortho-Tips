.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph img:not([src]){display:none}
.ph.wide{aspect-ratio:4/3;border-radius:var(--radius);font-size:64px}
.thumb{width:48px;height:48px;border-radius:12px;flex:none;aspect-ratio:auto;font-size:24px}
.list .item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);min-height:56px}
.list .item:first-child{border-top:0}
.list .item.click{cursor:pointer}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .e{font-size:44px}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font-weight:600;background:var(--water-soft);color:var(--water);border-color:transparent}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner .e{font-size:26px}
.kv{padding:8px 0;border-top:1px dashed var(--line)}
.kv:first-child{border-top:0}
.kv b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.big{font-size:20px;font-weight:700}
.aibox{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--surface2)}
.aibox.err{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button span{font-size:20px;line-height:1;padding:3px 14px;border-radius:99px}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.on span{background:var(--accent-soft)}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* sheets: the resting state is the visible state; --vh / --kb come from visualViewport */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fade-in .2s ease both}
.scrim.closing{animation:fade-out .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);max-height:calc(var(--vh,100vh) - 24px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;z-index:21;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:sheet-in .25s ease both;max-width:720px;margin:0 auto}
.sheet.closing{animation:sheet-out .22s ease both}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheet-out{from{transform:none}to{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}

.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
label.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.input,select.input,textarea.input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;outline:none}

.input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log{border-left:4px solid var(--line);padding:8px 10px;margin:8px 0;background:var(--surface2);border-radius:0 10px 10px 0}
.log.error{border-left-color:var(--bad)}.log.warn{border-left-color:var(--warn)}.log.info{border-left-color:var(--water)}
.log pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0;font:12px/1.4 ui-monospace,"Roboto Mono",monospace;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600}
a{color:var(--accent)}
.switch{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.hidden{display:none!important}

/* ---------- Ma voiture ---------- */
:root{--accent:#1b5cb8;--on-accent:#ffffff;--accent-soft:#e2ebf8;--bg:#f4f6f9;--surface2:#ebeff5;--line:#dce2ea;--muted:#586273;--text:#171b22}
html[data-theme="dark"]{--accent:#8ab4f8;--on-accent:#0b1a33;--accent-soft:#1c2c46;--bg:#0f1216;--surface:#191d23;--surface2:#232932;--line:#2e3540;--muted:#a3adbb;--text:#e6eaf0}
nav.tabs{grid-template-columns:repeat(5,1fr)}
nav.tabs button span{padding:3px 10px}
.topbar{display:flex;align-items:center;gap:6px;margin:0 -4px 10px}
.vbtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;min-height:48px;padding:4px;text-align:left;cursor:pointer;border-radius:12px}
.vbtn b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn .tiny{display:block}
.plate{display:inline-block;border:1.5px solid var(--text);border-radius:6px;padding:0 6px;font:600 12px/1.6 ui-monospace,"Roboto Mono",monospace;letter-spacing:.04em;white-space:nowrap}
.hero{display:flex;gap:14px;align-items:center}
.hero .ph{width:92px;height:92px;flex:none;border-radius:16px;aspect-ratio:auto;font-size:42px}
.kmbig{font-size:28px;font-weight:750;letter-spacing:-.01em;line-height:1.1}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.bar.soon i{background:var(--warn)}.bar.over i{background:var(--bad)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa button{min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:600;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.qa button span{font-size:24px}
.alert{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--surface);cursor:pointer;min-height:56px}
.alert .e{font-size:24px;flex:none}
.alert.over{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.alert.soon{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.alert.info{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;min-height:40px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.files{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.files .f{position:relative;flex:none;width:96px;height:96px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;border:1px solid var(--line)}
.files .f img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.files .f img:not([src]){display:none}
.files .f .x{position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer}
.viewer img{width:100%;border-radius:12px;display:block;margin-bottom:8px;background:var(--surface2)}
.bubble{background:var(--accent-soft);color:var(--text);border-radius:16px 16px 4px 16px;padding:10px 12px;margin:10px 0 10px 32px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .ph{margin-top:8px;border-radius:10px}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px;margin:10px 32px 10px 0}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:10px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--surface2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:18px}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);min-height:56px;cursor:pointer}
.row-item:first-child{border-top:0}
.row-item .e{font-size:24px;width:32px;text-align:center;flex:none}
.gear{position:relative}
.dot2{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.files .f .ed{position:absolute;bottom:2px;right:2px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer}
/* scanner */
.sheet.full{top:0;bottom:0;max-height:none;height:var(--vh,100vh);border-radius:0;display:flex;flex-direction:column;gap:6px;padding:4px 12px calc(12px + env(safe-area-inset-bottom));max-width:none}
.sheet.full .grab{display:none}
.scan-top{display:flex;align-items:center;gap:6px;min-height:48px}
.scan-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0d0f12;border-radius:14px;overflow:hidden;position:relative;padding:14px}
.scan-stage .aibox{background:none;border:0;color:#e6eaf0}
.crop-wrap{position:relative;touch-action:none;line-height:0}
.crop-wrap canvas.scan-src{display:block;max-width:100%;max-height:calc(var(--vh,100vh) - 280px);width:auto;height:auto}
.crop-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.crop-svg polygon{fill:rgba(138,180,248,.18);stroke:#8ab4f8;stroke-width:2;vector-effect:non-scaling-stroke}
.hdl{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;z-index:2}
.hdl::after{content:'';width:20px;height:20px;border-radius:50%;background:#1b5cb8;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.hdl.on::after{width:26px;height:26px;background:#8ab4f8}
.loupe{position:absolute;display:none;width:112px;height:112px;margin-left:-56px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none;z-index:3}
canvas.scan-out{display:block;max-width:100%;max-height:calc(var(--vh,100vh) - 330px);background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.5)}
canvas.scan-out.erasing{touch-action:none;cursor:crosshair;outline:2px dashed #8ab4f8}
.tool-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.tool{flex:none;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;padding:0 12px;white-space:nowrap;cursor:pointer}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.scan-filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.scan-filters .chip{flex:none}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
</style>

  for(const d of ofV(state.docs, v)){ const st = docStatus(d); if(st.s === 'over' || st.s === 'soon') a.push({lvl:st.s, e:DOC_ICON[d.type], text:docName(d) + ' — ' + docStateText(d), act:'openDoc', id:d.id, rank:st.n}); }
  for(const p of planOf(v)){ const r = maintStatus(p, v); if(r.status === 'over' || r.status === 'soon') a.push({lvl:r.status, e:picon(p), text:pname(p) + (remText(r) ? ' — ' + remText(r) : ''), act:'tab', tab:'maint', rank:r.remDays ?? 0}); }
  const L = lastReading(v);
  if(!L) a.push({lvl:'info', e:'📍', text:t('odoNone'), act:'km', rank:0});
  else { const n = dayNum(today()) - dayNum(L.date); if(n >= 30 && planOf(v).some(p => p.km)) a.push({lvl:'info', e:'📍', text:t('odoStale', {n}), act:'km', rank:0}); }
  return a.sort((x, y) => lv[x.lvl] - lv[y.lvl] || x.rank - y.rank);
}

/* ---------- fuel and expenses (every amount counted exactly once) ---------- */
function fuelStats(v){
  const fills = ofV(state.fuel, v).filter(f => f.km != null && f.liters).sort((a, b) => a.km - b.km || a.date.localeCompare(b.date));
  let prev = null, acc = 0, accCost = 0, L = 0, D = 0, C = 0; const seg = {};
  for(const f of fills){
    if(prev){
      acc += f.liters; accCost += f.total || 0;
      if(f.full){ const dist = f.km - prev.km; if(dist > 0){ seg[f.id] = acc / dist * 100; L += acc; D += dist; C += accCost; } acc = 0; accCost = 0; prev = f; }
    } else if(f.full) prev = f;
  }
  const last = ofV(state.fuel, v).filter(f => f.liters && f.total).sort((a, b) => b.date.localeCompare(a.date))[0];
  return {avg:D ? L / D * 100 : null, perKm:D ? C / D : null, seg, lastPrice:last ? last.total / last.liters : null};
}
function docCostDate(d){ return d.issueDate || isoDay(new Date(d.createdAt)); }
function expenses(v, y){
  const m = Array(12).fill(0), cat = {fuel:0, service:0, docs:0};
  const add = (date, amt, c) => { if(!amt || !date || !date.startsWith(y + '-')) return; cat[c] += amt; m[Number(date.slice(5, 7)) - 1] += amt; };
  ofV(state.fuel, v).forEach(f => add(f.date, f.total, 'fuel'));
  ofV(state.services, v).forEach(s => add(s.date, s.cost, 'service'));
  ofV(state.docs, v).forEach(d => add(docCostDate(d), d.cost, 'docs'));
  for(const k in cat) cat[k] = round2(cat[k]);
  const r = readings(v).filter(x => x.date.startsWith(y + '-'));
  const dist = r.length > 1 ? Math.max(...r.map(x => x.km)) - Math.min(...r.map(x => x.km)) : 0;
  return {m, cat, total:round2(cat.fuel + cat.service + cat.docs), dist};
}
function yearsOf(v){
  const ys = new Set([today().slice(0, 4)]);
  ofV(state.fuel, v).forEach(f => f.total && ys.add(f.date.slice(0, 4)));
  ofV(state.services, v).forEach(s => s.cost && ys.add(s.date.slice(0, 4)));
  ofV(state.docs, v).forEach(d => d.cost && ys.add(docCostDate(d).slice(0, 4)));
  return [...ys].sort().reverse();
}

/* ---------- photos: OrthoTips.files (storage permission) or the key/value store ---------- */
const Photos = {
  mem:new Map(),
  files(){ return !!(HOST && HOST.permissions.has('storage')); },
  async put(dataUrl, id){
    id = id || 'p' + uid();
    if(this.files()) await HOST.files.write('photos/' + id + '.txt', dataUrl);
    else storeSet(KEY_PHOTO + id, dataUrl);
    this.mem.set(id, dataUrl);
    return id;
  },
  async get(id){
    if(!id) return null;
    if(this.mem.has(id)) return this.mem.get(id);
    let v = null;
    try{ v = this.files() ? await HOST.files.read('photos/' + id + '.txt') : storeGet(KEY_PHOTO + id); }
    catch(e){ log('warn', 'photo', 'Photo not readable: ' + id, String(e && e.message)); }
    if(!v && this.files()) v = storeGet(KEY_PHOTO + id);   // in case it was saved before the permission existed
    if(v) this.mem.set(id, v);
    return v || null;
  },
  async del(id){
    if(!id) return;
    this.mem.delete(id);
    try{ if(this.files()) await HOST.files.delete('photos/' + id + '.txt'); }catch(e){ log('warn', 'photo', 'Photo not deleted: ' + id, String(e && e.message)); }
    storeDel(KEY_PHOTO + id);
  }
};

function readAsDataUrl(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(r.error || new Error('read')); r.readAsDataURL(file); }); }
function loadImage(src, ms){
  return new Promise(res => { const img = new Image(); let done = false; const fin = v => { if(!done){ done = true; res(v); } };
    img.onload = () => fin(img); img.onerror = () => fin(null); setTimeout(() => fin(null), ms); img.src = src; });
}
/* Shrinks to max 1024 px JPEG (fits Gemini and the store); returns the original if the WebView cannot decode it. */
async function shrink(dataUrl, max){
  max = max || 1024;
  const img = await loadImage(dataUrl, 3000);
  if(!img || !img.naturalWidth) return dataUrl;
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const ctx = c.getContext && c.getContext('2d'); if(!ctx) return dataUrl;
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', max > 1024 ? 0.85 : 0.8);
}

/* =====================================================================
   Gemini — always the newest available model, with fallback and logging
   ===================================================================== */
function apiKey(){ return (storeGet(KEY_API) || '').trim(); }
/* The app's Gemini key (bridge v6, permission `gemini`): the key never reaches this page.
   In that mode only the generateContent request goes through the app (http() below);
   Google's answer comes back unchanged, so everything after it works as with an own key. */
const APP_GEMINI = (HOST && HOST.gemini && HOST.permissions && HOST.permissions.has('gemini')) ? HOST.gemini : null;
const APP_AVOID_LITE = false;
let appGemini = null;   // { configured, model } once read from the app
async function readAppGemini(){
  if(!APP_GEMINI) return null;
  try{ appGemini = await APP_GEMINI.status(); }catch(e){ appGemini = null; }
  return appGemini;
}
function appKeyMode(){ return !!APP_GEMINI && state.settings.keyMode !== 'own'; }
function useAppKey(){ return appKeyMode() && !!(appGemini && appGemini.configured); }
/** Gemini can be used now: through the app, or with the extension's own key. */
function aiAvailable(){ return useAppKey() || !!apiKey(); }
/** The model asked of the app: this extension's own choice, else the app's. */
function appModelChoice(){
  const s = state.settings;
  if(s.model === 'custom' && s.customModel) return s.customModel;
  const alias = {flash:'gemini-flash-latest', pro:'gemini-pro-latest', lite:'gemini-flash-lite-latest'}[s.model];
  if(alias) return alias;
  const m = (appGemini && appGemini.model) || 'gemini-flash-latest';
  return APP_AVOID_LITE && /flash-lite/.test(m) ? 'gemini-flash-latest' : m;
}
/** generateContent through the app: same input and output as fetch, errors in this extension's codes. */
async function appGenerate(url, opts, ms){
  const m = /\/models\/([^:/]+):generateContent/.exec(url);
  let body = {};
  try{ body = JSON.parse((opts && opts.body) || '{}'); }catch(e){}
  let timer = 0;
  try{
    const res = await Promise.race([
      APP_GEMINI.generate({body, model:m ? decodeURIComponent(m[1]) : ''}),
      new Promise((_, reject) => { timer = setTimeout(() => reject(AppError('timeout', 'App Gemini: no answer after ' + Math.round((ms + 30000) / 1000) + ' s')), ms + 30000); })
    ]);
    if(res && res.model && appGemini) appGemini.lastModel = res.model;
    return (res && res.response) || {};
  }catch(e){
    if(e && e.code) throw e;
    const msg = String((e && e.message) || e);
    const status = +((/\((\d{3})\)/.exec(msg) || [])[1] || 0) || undefined;
    const code = {no_key:'noKey', key:'badKey', quota:'quota', server:'server', network:'network', blocked:'blocked', model:'noModel'}[e && e.kind]
      || (e && e.kind === 'format' ? (status ? 'http' : 'parse') : 'server');
    throw AppError(code, 'App Gemini (' + ((e && e.kind) || 'error') + '): ' + msg, status || (code === 'quota' ? 429 : undefined));
  }finally{ clearTimeout(timer); }
}
function AppError(code, detail, status){ const e = new Error(code); e.code = code; e.detail = detail; e.status = status; return e; }
function userMessage(e){
  const c = e && e.code;
  if(c === 'noKey' && appKeyMode() && !apiKey()) return t('err_noKeyApp');
  if(c === 'http') return t('err_http', {s:e.status});
  if(c && STR.fr['err_' + c]) return t('err_' + c);
  if(c === 'notPlant') return t('notPlant');
  return t('err_generic');
}
function checkNet(){
  if(useAppKey()){ if(navigator.onLine === false) throw AppError('offline'); return; }   // the app makes the request
  if(!apiKey()) throw AppError('noKey');
  if(HOST && !HOST.permissions.has('internet')) throw AppError('noInternetPerm');
  if(typeof window.fetch !== 'function') throw AppError('network', 'fetch unavailable');
  if(navigator.onLine === false) throw AppError('offline');
}
async function http(url, opts, ms){
  if(useAppKey() && /:generateContent/.test(url)) return appGenerate(url, opts, ms);
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), ms) : 0;
  let res;
  try{ res = await window.fetch(url, Object.assign({}, opts, ctrl ? {signal:ctrl.signal} : {})); }
  catch(e){ throw AppError(e && e.name === 'AbortError' ? 'timeout' : 'network', String(e && e.message || e)); }
  finally{ clearTimeout(timer); }
  let text = '', body = null;
  try{ text = await res.text(); body = JSON.parse(text); }catch(e){}
  if(!res.ok){
    const g = (body && body.error) || {};
    const msg = String(g.message || text || '').slice(0, 600);
    let code = 'http';
    if(res.status === 400 && /api key/i.test(msg)) code = 'badKey';
    else if(res.status === 401 || res.status === 403) code = 'denied';
    else if(res.status === 429) code = 'quota';
    else if(res.status >= 500) code = 'server';
    throw AppError(code, `HTTP ${res.status} ${g.status || ''} ${msg}`.trim(), res.status);
  }
  return body;
}
function headers(){ return {'Content-Type':'application/json', 'x-goog-api-key':apiKey()}; }

/* Ranks model names: newest version first, stable before preview, preferred family first. */
function parseModel(name){
  const m = /^gemini-(\d+(?:\.\d+)?)-(flash-lite|flash|pro)(-[a-z0-9.-]+)?$/i.exec(name);
  if(!m) return null;
  const suffix = (m[3] || '').toLowerCase();
  if(/(tts|live|image|audio|embed|robot|computer|translate|omni|veo|thinking|dialog|native|search|lite)/.test(suffix)) return null;
  return {name, ver:m[1].split('.').map(Number), family:m[2].toLowerCase(), stage:/exp/.test(suffix) ? 2 : /preview/.test(suffix) ? 1 : 0, plain:!suffix};
}
function cmpVer(a, b){ for(let i = 0; i < Math.max(a.length, b.length); i++){ const d = (b[i] || 0) - (a[i] || 0); if(d) return d; } return 0; }
function rankModels(names){
  const fam = {flash:0, pro:1, 'flash-lite':2};
  return names.map(parseModel).filter(Boolean).sort((a, b) =>
    cmpVer(a.ver, b.ver) || a.stage - b.stage || fam[a.family] - fam[b.family] || (b.plain - a.plain) || a.name.localeCompare(b.name)).map(x => x.name);
}
function candidates(){
  if(useAppKey()) return [appModelChoice()];   // the app falls back to its own models if needed
  const pref = {flash:'flash', pro:'pro', lite:'flash-lite'}[state.settings.model];
  let list = state.gemini.models.slice();
  if(pref){ const mine = list.filter(n => (parseModel(n) || {}).family === pref); list = mine.concat(list.filter(n => !mine.includes(n))); }
  list = list.slice(0, 4);
  for(const alias of ['gemini-flash-latest', 'gemini-pro-latest']) if(!list.includes(alias)) list.push(alias);
  return list;
}
async function refreshModels(force){
  if(useAppKey()) return state.gemini.models;   // the app keeps its own list
  const g = state.gemini;
  if(!force && g.models.length && Date.now() - g.fetchedAt < MODEL_TTL) return g.models;
  checkNet();
  const names = []; let token = '';
  try{
    for(let page = 0; page < 5; page++){
      const body = await http(API + '/models?pageSize=1000' + (token ? '&pageToken=' + encodeURIComponent(token) : ''), {headers:headers()}, 20000);
      for(const m of (body && body.models) || []){
        const methods = m.supportedGenerationMethods || [];
        if(methods.length && !methods.includes('generateContent')) continue;
        names.push(String(m.name || '').replace(/^models\//, ''));
      }
      token = body && body.nextPageToken; if(!token) break;
    }
  }catch(e){
    log('error', 'models', 'Model list failed: ' + userMessage(e), e.detail); e.logged = true;
    if(g.models.length && !['badKey', 'denied'].includes(e.code)) return g.models;   // keep using the cached list
    throw e;
  }
  const ranked = rankModels(names);
  if(!ranked.length){ log('error', 'models', 'No compatible model in the list', names.slice(0, 40).join(', ')); throw AppError('noModel'); }
  const before = g.models[0];
  g.models = ranked; g.fetchedAt = Date.now(); save();
  if(before !== ranked[0]) log('info', 'models', 'Newest model: ' + ranked[0], ranked.slice(0, 6).join(', '));
  return ranked;
}
function extractJson(text){
  let s = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a < 0 || b <= a) throw AppError('parse', 'No JSON object: ' + s.slice(0, 400));
  try{ return JSON.parse(s.slice(a, b + 1)); }
  catch(e){ throw AppError('parse', e.message + ' — ' + s.slice(0, 400)); }
}
async function callModel(model, parts, thinking){
  const ver = (parseModel(model) || {ver:[0]}).ver;
  const cfg = {responseMimeType:'application/json'};
  if(thinking && ver[0] >= 3) cfg.thinkingConfig = {thinkingLevel:'low'};
  let body;
  try{
    body = await http(`${API}/models/${encodeURIComponent(model)}:generateContent`,
      {method:'POST', headers:headers(), body:JSON.stringify({contents:Array.isArray(parts) ? [{role:'user', parts}] : parts.contents, generationConfig:cfg})}, 90000);
  }catch(e){
    if(cfg.thinkingConfig && e.status === 400 && /thinking/i.test(e.detail || '')){
      log('warn', 'models', model + ': thinking setting refused, retrying without it', e.detail);
      return callModel(model, parts, false);
    }
    throw e;
  }
  const cand = body && body.candidates && body.candidates[0];
  if(!cand){ throw AppError('blocked', 'No candidate. ' + JSON.stringify((body && body.promptFeedback) || {}).slice(0, 300)); }
  const text = ((cand.content && cand.content.parts) || []).filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
  if(!text) throw AppError(cand.finishReason === 'SAFETY' ? 'blocked' : 'parse', 'Empty answer, finishReason=' + cand.finishReason);
  try{ return extractJson(text); }
  catch(e){ e.detail = 'finishReason=' + cand.finishReason + ' — ' + e.detail; throw e; }
}
/* Tries the newest model, then the next ones when a model is missing, overloaded, out of quota or unreadable. */
async function generate(ctx, parts){
  checkNet();
  await refreshModels(false);
  const list = candidates();
  let last = null;
  for(const model of list){
    try{
      const out = await callModel(model, parts, true);
      if(state.gemini.lastModel !== model){ state.gemini.lastModel = model; save(); }
      return {model, out};
    }catch(e){
      last = e;
      const retry = ['quota', 'server', 'timeout', 'parse', 'blocked'].includes(e.code) || (e.code === 'http' && [400, 404].includes(e.status));
      log(retry ? 'warn' : 'error', ctx, model + ' — ' + userMessage(e), e.detail); e.logged = true;
      if(e.code === 'http' && e.status === 404){ state.gemini.fetchedAt = 0; save(); }
      if(!retry) break;
    }
  }
  throw last || AppError('noModel');
}

  if(out.isOdometer === false || v == null) throw AppError('notOdo', JSON.stringify(out).slice(0, 200));
  return {value:Math.round(v), unit:out.unit === 'mi' ? 'mi' : 'km', model};
}
async function aiPlan(v){
  const prompt = `You are a master mechanic. Give the manufacturer-recommended maintenance schedule for this vehicle, for use in ${where()} (hot climate, dust, variable fuel quality: use the "severe conditions" intervals when the manufacturer defines them).
${vehicleLine(v)}
Use these item types when they apply: ${Object.keys(MAINT).filter(k => k !== 'custom').join(', ')}. Use type "custom" with a name for anything else important for this model (max 4).
Write "name" and "note" in ${answerLang()}. km and months are whole numbers, 0 when not applicable.
Return ONLY JSON, no markdown: {"items": [{"type": "oil", "name": "", "km": 10000, "months": 12, "note": ""}], "notes": ""}`;
  const {model, out} = await generate('plan', [{text:prompt}]);
  const items = (Array.isArray(out.items) ? out.items : []).map(x => ({type:MAINT[x && x.type] ? x.type : 'custom', name:str(x && x.name, 80),
      km:Math.round(num(x && x.km, 0, 1e6) || 0), mo:Math.round(num(x && x.months, 0, 240) || 0), note:str(x && x.note, 300)}))
    .filter(x => (x.km || x.mo) && (x.type !== 'custom' || x.name)).slice(0, 20);
  if(!items.length) throw AppError('parse', 'No plan items: ' + JSON.stringify(out).slice(0, 300));
  return {model, items, notes:str(out.notes, 600)};
}
function mechanicPrompt(v){
  return `You are an experienced, honest car mechanic advising a driver in ${where()}. Likely causes first, then simple checks the driver can do safely, then solutions. Say clearly when the car must not be driven. Give rough repair costs in Algerian dinars (DA) as a range, parts and labour.
${vehicleLine(v)}
Service status:
${historyLine(v)}
Write every text value in ${answerLang()}.
Always answer with ONLY a JSON object, no markdown:
{"summary": "", "urgency": "low|medium|high|critical", "canDrive": "yes|caution|no", "causes": [{"name": "", "likelihood": "high|medium|low", "why": ""}], "checks": [""], "fixes": [{"action": "", "diy": false, "difficulty": "easy|medium|hard", "cost": ""}], "mechanic": "", "safety": "", "followUps": [""]}
"followUps": up to 3 short questions the driver could answer to refine the diagnosis.`;
}
async function aiMechanic(th, v){
  const contents = [];
  for(let i = 0; i < th.msgs.length; i++){
    const m = th.msgs[i];
    if(m.r === 'u'){
      const parts = [{text:(i === 0 ? mechanicPrompt(v) + '\n\nDriver: ' : 'Driver (follow-up; answer with the same JSON format): ') + (m.text || '(see photo)')}];
      if(m.photo){ const url = await Photos.get(m.photo); if(url) parts.push(imagePart(url)); }
      contents.push({role:'user', parts});
    } else contents.push({role:'model', parts:[{text:JSON.stringify(m.a)}]});
  }
  const {model, out} = await generate('mechanic', {contents});
  const a = cleanAnswer(out);
  if(!a.summary && !a.causes.length) throw AppError('parse', 'Empty answer: ' + JSON.stringify(out).slice(0, 300));
  return {a, model};
}

function logAppError(ctx, e){

}

/* =====================================================================
   Sheets (keyboard-safe: no autofocus, @keyframes, visualViewport)
   ===================================================================== */
function openSheet(html, onMount){
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sheet = document.createElement('div'); sheet.className = 'sheet'; sheet.setAttribute('role', 'dialog');
  sheet.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(scrim, sheet);
  ui.sheets.push({scrim, sheet});
  scrim.addEventListener('click', closeSheet);
  sheet.addEventListener('focusin', e => {
    const f = e.target; if(!f.matches || !f.matches('input,select,textarea')) return;
    setTimeout(() => { fitViewport(); f.scrollIntoView({block:'center', behavior:'smooth'}); }, 320);
  });
  if(onMount) onMount(sheet);
  hydratePhotos(sheet);
  return sheet;
}
function closeSheet(){
  const e = ui.sheets.pop(); if(!e) return false;
  if(document.activeElement && e.sheet.contains(document.activeElement)) document.activeElement.blur();
  e.scrim.classList.add('closing'); e.sheet.classList.add('closing');
  setTimeout(() => { e.scrim.remove(); e.sheet.remove(); }, 230);
  return true;
}
function closeAllSheets(){ while(ui.sheets.length) closeSheet(); }
function fitViewport(){
  const root = document.documentElement.style, vv = window.visualViewport;
  const visible = vv ? vv.height : window.innerHeight;
  const keyboard = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  root.setProperty('--vh', visible + 'px'); root.setProperty('--kb', keyboard + 'px');
}
if(window.visualViewport){ visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }
window.addEventListener('resize', fitViewport);

/* =====================================================================
   Document scanner. The image functions below are pure (they work on
   {width, height, data}) so they can be tested without a browser.
   ===================================================================== */
/* SCAN-CORE-START */
function imgNew(w, h){ return {width:w, height:h, data:new Uint8ClampedArray(w * h * 4)}; }
function imgCopy(im){ return {width:im.width, height:im.height, data:new Uint8ClampedArray(im.data)}; }
function toGray(im){ const n = im.width * im.height, g = new Float32Array(n), d = im.data; for(let i = 0, j = 0; i < n; i++, j += 4) g[i] = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2]; return g; }
function boxBlur(a, w, h, r){
  const tmp = new Float32Array(a.length), out = new Float32Array(a.length), k = 2 * r + 1;
  for(let y = 0; y < h; y++){ const o = y * w; let s = 0;
    for(let x = -r; x <= r; x++) s += a[o + Math.min(w - 1, Math.max(0, x))];
    for(let x = 0; x < w; x++){ tmp[o + x] = s / k; s += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; } }
  for(let x = 0; x < w; x++){ let s = 0;
    for(let y = -r; y <= r; y++) s += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
    for(let y = 0; y < h; y++){ out[y * w + x] = s / k; s += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; } }
  return out;
}
function maxFilter(a, w, h, r){
  const tmp = new Float32Array(a.length), out = new Float32Array(a.length);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){ let m = 0; for(let k = Math.max(0, x - r); k <= Math.min(w - 1, x + r); k++) m = Math.max(m, a[y * w + k]); tmp[y * w + x] = m; }
  for(let x = 0; x < w; x++) for(let y = 0; y < h; y++){ let m = 0; for(let k = Math.max(0, y - r); k <= Math.min(h - 1, y + r); k++) m = Math.max(m, tmp[k * w + x]); out[y * w + x] = m; }
  return out;
}
/* Area-average downscale (keeps the image if already small enough). */
function resizeImg(im, maxSide){
  const s = Math.min(1, maxSide / Math.max(im.width, im.height)); if(s >= 1) return im;
  const w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s)), out = imgNew(w, h), d = im.data, W = im.width;
  for(let y = 0; y < h; y++){
    const y0 = Math.floor(y / s), y1 = Math.min(im.height, Math.max(y0 + 1, Math.floor((y + 1) / s)));
    for(let x = 0; x < w; x++){
      const x0 = Math.floor(x / s), x1 = Math.min(W, Math.max(x0 + 1, Math.floor((x + 1) / s)));
      let r = 0, g = 0, b = 0, n = 0;
      for(let yy = y0; yy < y1; yy++) for(let xx = x0; xx < x1; xx++){ const k = (yy * W + xx) * 4; r += d[k]; g += d[k + 1]; b += d[k + 2]; n++; }
      const o = (y * w + x) * 4; out.data[o] = r / n; out.data[o + 1] = g / n; out.data[o + 2] = b / n; out.data[o + 3] = 255;
    }
  }
  return out;
}
function otsu(g){
  const hist = new Float64Array(256); for(let i = 0; i < g.length; i++) hist[Math.max(0, Math.min(255, g[i] | 0))]++;
  let sum = 0; for(let i = 0; i < 256; i++) sum += i * hist[i];
  let sB = 0, wB = 0, best = -1, thr = 127;
  for(let i = 0; i < 256; i++){ wB += hist[i]; if(!wB) continue; const wF = g.length - wB; if(!wF) break;
    sB += i * hist[i]; const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF); if(v > best){ best = v; thr = i; } }
  return thr;
}
function components(mask, w, h){
  const lab = new Int32Array(w * h).fill(-1), comps = [], stack = new Int32Array(w * h);
  for(let i = 0; i < w * h; i++){
    if(!mask[i] || lab[i] >= 0) continue;
    const id = comps.length; let sp = 0, area = 0, x0 = w, y0 = h, x1 = 0, y1 = 0, border = 0;
    stack[sp++] = i; lab[i] = id;
    while(sp){
      const p = stack[--sp], x = p % w, y = (p / w) | 0; area++;
      if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y;
      if(x === 0 || y === 0 || x === w - 1 || y === h - 1) border++;
      if(x > 0 && mask[p - 1] && lab[p - 1] < 0){ lab[p - 1] = id; stack[sp++] = p - 1; }
      if(x < w - 1 && mask[p + 1] && lab[p + 1] < 0){ lab[p + 1] = id; stack[sp++] = p + 1; }
      if(y > 0 && mask[p - w] && lab[p - w] < 0){ lab[p - w] = id; stack[sp++] = p - w; }
      if(y < h - 1 && mask[p + w] && lab[p + w] < 0){ lab[p + w] = id; stack[sp++] = p + w; }
    }
    comps.push({id, area, x0, y0, x1, y1, border});
  }
  return {lab, comps};
}
function quadArea(q){ let a = 0; for(let i = 0; i < 4; i++){ const p = q[i], n = q[(i + 1) % 4]; a += p.x * n.y - n.x * p.y; } return Math.abs(a) / 2; }
/* Corners in order top-left, top-right, bottom-right, bottom-left. */
function sortQuad(q){
  const cx = q.reduce((s, p) => s + p.x, 0) / 4, cy = q.reduce((s, p) => s + p.y, 0) / 4;
  const byAngle = q.slice().sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
  let start = 0; byAngle.forEach((p, i) => { if(p.x + p.y < byAngle[start].x + byAngle[start].y) start = i; });
  return [0, 1, 2, 3].map(i => byAngle[(start + i) % 4]);
}
function isConvex(q){
  let sign = 0;
  for(let i = 0; i < 4; i++){ const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
    const z = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x); if(Math.abs(z) < 1e-6) return false;
    if(!sign) sign = Math.sign(z); else if(Math.sign(z) !== sign) return false; }
  return true;

      if(s === 'retake'){ choosePhoto(opts.src || 'cam', u => load(u), {max:2400}); return; }
      if(!S.src) return;
      if(s === 'auto'){ const q = detectQuad(S.src); if(q){ S.detected = q; S.q = q.map(p => ({...p})); slot('hint').textContent = t('scanFound'); } else { toast(t('scanNoDetect')); } S.cache = {}; placeHandles(); }
      else if(s === 'full'){ S.q = insetQuad(S.src, 0); S.cache = {}; placeHandles(); }
      else if(s === 'next'){
        const q = sortQuad(S.q);
        if(!isConvex(q) || quadArea(q) < S.src.width * S.src.height * 0.02){ toast(t('scanBadQuad')); return; }
        S.q = q; await process(); if(sheet.isConnected) showEdit();
      }
      else if(s === 'crop'){ S.strokes = []; S.eraser = false; showCorners(); }
      else if(s === 'filter'){ S.filter = b.dataset.f; await process(); showEdit(); }
      else if(s === 'clean'){ S.clean = !S.clean; await process(); showEdit(); }
      else if(s === 'eraser'){ S.eraser = !S.eraser; showEdit(); }
      else if(s === 'undo'){ S.strokes.pop(); await process(); showEdit(); }
      else if(s === 'rotL' || s === 'rotR'){
        const turn = s === 'rotR' ? 1 : 3, w = S.cache.rotImg.width, h = S.cache.rotImg.height;
        S.strokes = S.strokes.map(st => ({r:st.r, pts:st.pts.map(p => rotatePoint(p, w, h, turn))}));
        S.rot = (S.rot + turn) % 4; await process(); showEdit();
      }
      else if(s === 'done' || s === 'doneNext'){
        busy(true); await idle();
        let out;
        try{ out = encodeImage(S.out, 0.85); }catch(err){ log('error', 'photo', 'Scanner could not encode the page', String(err && err.message)); toast(t('photoFailed')); busy(false); return; }
        closeSheet(); opts.onDone(out);
        if(s === 'doneNext' && opts.onNext) opts.onNext();
      }
    });
    load(url);
  });
}

function fileTile(f, removable, idx){
  const inner = f.kind === 'pdf' ? `📄<span class="tiny" style="position:absolute;bottom:4px">${esc(t('pdfLabel'))}</span>` : f.url ? `<img src="${esc(f.url)}" alt="">` : `${DOC_ICON.autre}<img data-photo="${esc(f.id)}" alt="">`;
  return `<div class="f">${inner}${removable ? `<button class="x" type="button" data-do="rmFile" data-i="${idx}" aria-label="${esc(t('delete'))}">✕</button>` : ''}${removable && f.kind === 'img' ? `<button class="ed" type="button" data-do="editFile" data-i="${idx}" aria-label="${esc(t('scanEditPage'))}">✎</button>` : ''}</div>`;
}
/* Camera or gallery → scanner (PDFs are added as they are). "✓ + page" chains the next page. */
function scanPick(src, draft, refresh){
  choosePhoto(src, (url, kind) => {
    const add = u => { if(draft.files.length < 8){ draft.files.push({url:u, kind:'img'}); refresh(); } };
    if(kind === 'pdf'){ if(draft.files.length < 8){ draft.files.push({url, kind}); refresh(); } return; }
    openScanner(url, {src, onDone:add, onNext:() => scanPick(src, draft, refresh)});
  }, {max:2400, pdf:true});
}

        finally{ draft.busy = false; b.disabled = false; }
      }

                                 energy:vd.energy || 'essence', plate:vd.plate, vin:vd.vin, color:vd.color, engine:vd.engine, readings:[], createdAt:Date.now()});
          state.vehicles.push(target); state.plan.push(...defaultPlan(target.id, target.energy)); state.current = target.id;
        }

        }

function vehicleGaps(v, vd){ return ['plate', 'vin', 'make', 'model', 'year', 'color', 'engine'].some(k => vd[k] && !v[k]); }

  if(vd.energy && !v.readings.length && !state.services.some(s => s.vid === v.id)) v.energy = vd.energy;
}

  });

/* ---------- calendar, files, backup ---------- */
function icsEsc(s){ return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function atHour(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, state.settings.hour, 0, 0, 0).getTime(); }
function futureAt(s){ let at = atHour(s); const now = Date.now(); if(at <= now){ at = atHour(today()); if(at <= now) at = atHour(addDays(today(), 1)); } return at; }
function buildIcs(){
  const pad = n => String(n).padStart(2, '0'), H = pad(state.settings.hour);
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ortho Tips//Ma voiture//' + lang().toUpperCase(), 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  const ev = (uid, date, title, desc, leads) => {
    L.push('BEGIN:VEVENT', `UID:${uid}@${ID}`, 'DTSTAMP:' + stamp, `DTSTART:${date.replace(/-/g, '')}T${H}0000`, 'DURATION:PT30M', 'SUMMARY:' + icsEsc(title), 'DESCRIPTION:' + icsEsc(desc));
    for(const n of [0, ...leads]) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(title), 'TRIGGER:' + (n ? `-P${n}D` : 'PT0M'), 'END:VALARM');
    L.push('END:VEVENT');
  };
  let n = 0;
  for(const v of state.vehicles){
    for(const d of ofV(state.docs, v)) if(d.expiry && d.expiry >= today()){ n++; ev('doc-' + d.id, d.expiry, t('nDocDue', {doc:docName(d)}) + ' — ' + v.name, t('nDocDueBody'), state.settings.leads); }
    for(const p of planOf(v)){ const r = maintStatus(p, v); if(r.est && r.est >= today()){ n++; ev('mnt-' + p.id, r.est, t('nMntDue', {x:pname(p)}) + ' — ' + v.name, t('nextDue', {w:dueText(r)}), [7]); } }
  }
  L.push('END:VCALENDAR');
  return n ? L.join('\r\n') + '\r\n' : null;
}
async function saveText(name, text, mime){
  if(HOST) return HOST.saveFile(name, text, mime);
  const url = URL.createObjectURL(new Blob([text], {type:mime}));
  const a = Object.assign(document.createElement('a'), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
function checkExportPerm(ctx){
  if(HOST && !HOST.permissions.has('import_export')){ log('error', ctx, 'import_export not granted'); toast('⚠️ ' + t('noPickPerm')); return false; }
  return true;
}

async function saveDataUrl(name, url){
  const i = url.indexOf(','), mime = url.slice(5, url.indexOf(';')), bin = atob(url.slice(i + 1));
  const bytes = new Uint8Array(bin.length); for(let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
  if(HOST) return HOST.saveFile(name, bytes, mime);
  const blobUrl = URL.createObjectURL(new Blob([bytes], {type:mime}));
  const a = Object.assign(document.createElement('a'), {href:blobUrl, download:name}); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(blobUrl), 5000); return true;
}

/* =====================================================================
   Notifications — scheduled by the app (OrthoTips.notifications, bridge v3+)
   ===================================================================== */
function wantedReminders(){
  const out = [], now = Date.now(), multi = state.vehicles.length > 1;
  const tag = v => multi ? ' — ' + v.name : '';
  for(const v of state.vehicles){
    for(const d of ofV(state.docs, v)){
      if(!d.expiry) continue;
      for(const n of state.settings.leads){
        const at = atHour(addDays(d.expiry, -n));
        if(at > now) out.push({id:`doc-${d.id}-${n}`, title:t('nDocSoon', {doc:docName(d), n}) + tag(v), body:t('nDocSoonBody', {d:fmtDay(d.expiry)}), at, repeatDays:0, data:'doc:' + d.id});
      }
      const over = d.expiry < today();
      out.push({id:`doc-${d.id}-due`, title:(over ? t('nDocOver', {doc:docName(d)}) : t('nDocDue', {doc:docName(d)})) + tag(v), body:t('nDocDueBody'), at:futureAt(d.expiry), repeatDays:1, data:'doc:' + d.id});
    }
    let kmBased = false;
    for(const p of planOf(v)){
      if(p.km) kmBased = true;
      const r = maintStatus(p, v); if(!r.est) continue;
      const body = t('nMntBody', {w:t('nextDue', {w:dueText(r)})});
      const soon = atHour(addDays(r.est, -7));
      if(soon > now) out.push({id:`mnt-${p.id}-soon`, title:t('nMntSoon', {x:pname(p)}) + tag(v), body, at:soon, repeatDays:0, data:'mnt:' + p.id});
      out.push({id:`mnt-${p.id}-due`, title:t('nMntDue', {x:pname(p)}) + tag(v), body, at:futureAt(r.est), repeatDays:3, data:'mnt:' + p.id});
    }
    const L = lastReading(v);
    if(kmBased && L) out.push({id:`odo-${v.id}`, title:t('nOdo') + tag(v), body:t('nOdoBody', {v:v.name}), at:futureAt(addDays(L.date, 7)), repeatDays:7, data:'odo:' + v.id});
  }
  return out.map(x => Object.assign(x, {title:x.title.slice(0, 100), body:x.body.slice(0, 300)})).sort((a, b) => a.at - b.at).slice(0, 60);
}
function notifStateHtml(){
  if(!state.settings.notify) return `<p class="small muted">${esc(t('notifOff'))}</p>`;
  if(Notif.failed) return `<div class="aibox err small">⚠️ ${esc(t('notifError'))}</div>`;
  const st = Notif.status;
  if(!st) return `<p class="small muted">${esc(t('notifWait'))}</p>`;
  let h = '';
  if(!st.granted) h += `<div class="aibox small">${esc(Notif.asked ? t('notifDenied') : t('notifAsk'))}<div class="btns"><button class="btn" type="button" data-act="notifAllow">${esc(t('notifAllow'))}</button></div></div>`;
  if(Notif.count) h += `<p class="small" data-notif-count="${Notif.count}">${esc(t('notifActive', {n:Notif.count}))}${Notif.next ? ` <span class="muted">· ${esc(t('notifNext', {d:fmtTime(Notif.next)}))}</span>` : ''}</p>`;
  return h;
}
const Notif = {
  status:null, count:0, next:0, failed:false, asked:false, timer:0, running:null, again:false,
  api(){ return HOST && HOST.notifications && typeof HOST.notifications.schedule === 'function' ? HOST.notifications : null; },
  supported(){ return !!(this.api() && HOST.permissions.has('notifications')); },
  sync(){ if(!this.supported()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 300); },
  paint(){ const el = document.getElementById('notifState'); if(el) el.innerHTML = notifStateHtml(); },
  async refreshStatus(){
    try{ this.status = await this.api().status(); }
    catch(e){ this.status = null; log('error', 'notif', 'Status unavailable', String(e && e.message)); }
    this.paint();
  },
  async run(){
    if(this.running){ this.again = true; return; }
    if(!this.supported() || loadFailed) return;
    const api = this.api();
    this.running = (async () => {
      let errors = 0;
      const step = async (what, fn) => { try{ return await fn(); }catch(e){ errors++; log('error', 'notif', what, String(e && e.message)); return null; } };
      const existing = (await step('List failed', () => api.list())) || [];
      const want = state.settings.notify ? wantedReminders() : [];
      const ids = new Set(want.map(w => w.id));
      for(const n of existing) if(!ids.has(n.id)) await step('Cancel failed: ' + n.id, () => api.cancel(n.id));
      let ok = 0;
      for(const w of want){
        const c = existing.find(n => n.id === w.id);
        if(c && c.title === w.title && c.body === w.body && Number(c.at) === w.at && Number(c.repeatDays) === w.repeatDays && c.data === w.data){ ok++; continue; }
        if(await step('Schedule failed: ' + w.id, () => api.schedule(w))) ok++;
      }
      this.count = ok; this.next = want.length ? want[0].at : 0; this.failed = errors > 0;
      this.paint();
    })();
    try{ await this.running; } finally{ this.running = null; }
    if(this.again){ this.again = false; this.run(); }
  },
  /* A tapped reminder opens what it is about. */
  openFrom(ev){
    const data = ev && ev.data ? String(ev.data) : '';
    const [kind, id] = [data.slice(0, data.indexOf(':')), data.slice(data.indexOf(':') + 1)];
    closeAllSheets(); ui.view = null;
    if(kind === 'doc'){ const d = state.docs.find(x => x.id === id); if(!d) return false; state.current = d.vid; ui.tab = 'docs'; ui.pending = () => openDocDetail(d); return true; }
    if(kind === 'mnt'){ const p = state.plan.find(x => x.id === id); if(!p) return false; state.current = p.vid; ui.tab = 'maint'; return true; }
    if(kind === 'odo'){ const v = veh(id); if(!v) return false; state.current = v.id; ui.tab = 'home'; ui.pending = () => openKmSheet(v); return true; }
    return false;
  }
};

    case 'year': ui.year = el.dataset.y; render(); break;
    case 'qp': { const q = $('#q'); ui.aiText = t('q_' + el.dataset.q + '_t'); if(q) q.value = ui.aiText; if(el.dataset.q === 'light' && !ui.aiPhoto) choosePhoto('cam', url => { ui.aiPhoto = url; ui.aiText = $('#q') ? $('#q').value : ui.aiText; render(); }); break; }
    case 'aiPick': choosePhoto(el.dataset.src, url => { ui.aiPhoto = url; ui.aiText = $('#q') ? $('#q').value : ui.aiText; render(); }); break;
    case 'aiClear': ui.aiPhoto = null; ui.aiText = $('#q') ? $('#q').value : ui.aiText; render(); break;
    case 'ask': await ask(); break;
    case 'openThread': { const th = state.threads.find(x => x.id === id); if(th) openThreadSheet(th); break; }
    case 'toggleKey': { const inp = $('#apikey'); const val = inp ? inp.value : ''; ui.showKey = !ui.showKey; render(); $('#apikey').value = val; break; }
    case 'saveKey': {
      const k = ($('#apikey').value || '').trim();
      if(k.length < 20 || /\s/.test(k)){ ui.keyMsg = `<div class="aibox err">${esc(t('keyInvalidFormat'))}</div>`; log('warn', 'models', 'Key rejected before saving (format)'); render(); break; }
      try{ storeSet(KEY_API, k); }catch(err){ log('error', 'storage', 'Key not saved', String(err && err.message)); break; }
      state.gemini = {models:[], fetchedAt:0, lastModel:''}; save(); toast(t('keySaved'));
      await testKey(); break;
    }
    case 'testKey': case 'refreshModels': await testKey(); break;
    case 'removeKey': storeDel(KEY_API); state.gemini = {models:[], fetchedAt:0, lastModel:''}; ui.keyMsg = null; save(); render(); toast(t('keyRemoved')); break;
    case 'lead': { const n = Number(el.dataset.n), L = state.settings.leads; state.settings.leads = L.includes(n) ? L.filter(x => x !== n) : [...L, n].sort((a, b) => b - a); save(); render(); break; }
    case 'notifAllow': {
      try{ Notif.status = await Notif.api().requestAccess(); }catch(err){ log('error', 'notif', 'Permission request failed', String(err && err.message)); }
      Notif.asked = true;
      if(Notif.status && !Notif.status.granted) log('warn', 'notif', 'Android notifications refused');
      Notif.paint(); break;
    }
    case 'openLog': ui.view = 'log'; state.seenLog = Date.now(); save(); render(); window.scrollTo(0, 0); break;
    case 'clearLog': if(confirm(t('confirmClearLog'))){ storeDel(KEY_LOG); render(); toast(t('logCleared')); } break;
    case 'exportLog': if(checkExportPerm('backup')){ const ok = await saveText(`${ID}-journal-${today()}.txt`, logText(), 'text/plain'); if(ok) toast(t('backupSaved')); } break;
    case 'exportIcs': {
      const ics = buildIcs(); if(!ics){ toast(t('icsNone')); break; }
      if(!checkExportPerm('ics')) break;
      try{ if(await saveText('echeances-voiture.ics', ics, 'text/calendar')) toast(t('icsSaved')); }catch(err){ log('error', 'ics', 'Calendar export failed', String(err && err.message)); }
      break;
    }
    case 'exportJson': await exportBackup(); break;
    case 'importJson': if(checkExportPerm('backup')) $('#pickJson').click(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.input; if(!k) return;
  const s = state.settings;
  if(k === 'hour') s.hour = clampInt(el.value, 0, 23, 9);
  else if(k === 'model'){ s.model = el.value; state.gemini.lastModel = ''; }
  else if(k === 'lang') s.lang = el.value;
  else if(k === 'place') s.place = el.value.trim().slice(0, 120);
  else if(k === 'notify') s.notify = !!el.checked;
  save();
  if(k !== 'place') render();
});
document.addEventListener('input', e => { if(e.target.id === 'q') ui.aiText = e.target.value; });
document.getElementById('view').addEventListener('focusin', e => {
  const f = e.target; if(!f.matches || !f.matches('input,textarea')) return;
  setTimeout(() => { fitViewport(); f.scrollIntoView({block:'center', behavior:'smooth'}); }, 320);
});

/* ---------- theme, Back, start ---------- */
function applyTheme(th){ document.documentElement.dataset.theme = th === 'dark' ? 'dark' : 'light'; }
if(HOST){
  applyTheme(HOST.theme); HOST.onThemeChange(applyTheme);
  HOST.onBack(() => {
    if(ui.sheets.length){ closeSheet(); return true; }
    if(ui.view){ ui.view = ui.view === 'log' ? 'settings' : null; render(); return true; }
    if(ui.tab !== 'home'){ ui.tab = 'home'; render(); return true; }
    return false;
  });
} else {
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  applyTheme(mq && mq.matches ? 'dark' : 'light');
  if(mq && mq.addEventListener) mq.addEventListener('change', ev => applyTheme(ev.matches ? 'dark' : 'light'));
}
if(Notif.supported()){
  Notif.openFrom(HOST.notifications.launch);
  HOST.notifications.onOpen(ev => { if(Notif.openFrom(ev)){ render(); runPending(); window.scrollTo(0, 0); } });
}
render(); runPending();
if(Notif.supported()){ Notif.refreshStatus(); Notif.sync(); }
if(APP_GEMINI){
  // Back from the app's settings (or any switch back to the page): the key may have been set meanwhile.
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') readAppGemini().then(() => render()); });
}
setTimeout(async () => {
  if(APP_GEMINI){ await readAppGemini(); render(); }
  if(useAppKey()) return;   // the app keeps the model list and makes the requests
  if(!apiKey() || (HOST && !HOST.permissions.has('internet'))) return;
  refreshModels(false).then(() => { if(ui.view === 'settings') render(); }).catch(() => {});
}, 0);

</script>
</body>
</html>
