<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f6;--text:#1b1d22;--muted:#5f6b76;--line:#e3e6eb;
  --accent:#3f51b5;--on-accent:#ffffff;--accent-soft:#e8eaf8;--good:#1e8e5a;--good-soft:#e3f5ec;--bad:#c62828;--bad-soft:#fdecec;
  --warn:#b26a00;--warn-soft:#fff3dd;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --radius:16px;--nav:64px;
  --c1:#3f51b5;--c2:#00897b;--c3:#f4511e;--c4:#8e24aa;--c5:#fbc02d;--c6:#039be5;--c7:#6d4c41;
}
html[data-theme="dark"]{
  --bg:#121417;--surface:#1d2025;--surface2:#262a31;--text:#e6e9ee;--muted:#a3adb8;--line:#30353d;
  --accent:#9fa8ff;--on-accent:#11131a;--accent-soft:#2a2f4d;--good:#5fd39a;--good-soft:#193528;--bad:#ff8a80;--bad-soft:#3d2020;
  --warn:#ffc15e;--warn-soft:#3a2e17;--shadow:none;
  --c1:#9fa8ff;--c2:#4dd0c1;--c3:#ff8a65;--c4:#ce93d8;--c5:#ffe082;--c6:#4fc3f7;--c7:#bcaaa4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Roboto,sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
main{padding:12px 16px 24px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;font-weight:600}
h3{margin:0;font-size:16px}
.hero{background:var(--accent);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#00897b));color:#fff;border:0}
html[data-theme="dark"] .hero{color:#11131a}
.hero .label{opacity:.85;font-size:13px}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.hero .sub{opacity:.9;font-size:12px}
.icon-btn{min-width:44px;min-height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.hero .icon-btn{background:rgba(255,255,255,.18)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.16);border-radius:12px;padding:8px}
html[data-theme="dark"] .stat{background:rgba(0,0,0,.12)}
.stat .v{font-weight:700;font-size:14px}
.stat .k{font-size:11px;opacity:.85}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:12px}
.qa span{font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;min-height:36px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600}
.pill.good{background:var(--good-soft)}.pill.bad{background:var(--bad-soft)}.pill.warn{background:var(--warn-soft)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.list .item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer;min-height:52px}
.list .item:first-child{border-top:0}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.amount{font-weight:650;text-align:right;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.good > i{background:var(--good)}.bar.bad > i{background:var(--bad)}
.goal{cursor:pointer}
.goal .emoji{font-size:30px;width:52px;height:52px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .e{font-size:40px}
.btn{border:0;border-radius:12px;min-height:44px;padding:0 16px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button span{font-size:20px;line-height:1;padding:3px 14px;border-radius:99px}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.on span{background:var(--accent-soft)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:38px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
/* sheets — the resting state is always "fully visible"; animations only decorate it.
   --vh is the height really visible (keyboard excluded) and --kb the keyboard
   overlapping the page, both kept up to date from visualViewport. */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fade-in .2s ease both}
.scrim.closing{animation:fade-out .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);max-height:calc(var(--vh,100vh) - 24px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;z-index:21;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:sheet-in .25s ease both}
.sheet.closing{animation:sheet-out .22s ease both}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheet-out{from{transform:none}to{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{animation:none}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:18px;margin-bottom:10px}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.input,select.input,textarea.input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;outline:none}
.input:focus{border-color:var(--accent)}
.input.big{font-size:24px;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.kv:first-child{border-top:0}
.month{font-size:12px;color:var(--muted);font-weight:600;margin:14px 2px 4px;display:flex;justify-content:space-between}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:100%}
.chart .b{width:10px;border-radius:4px 4px 0 0;background:var(--good);min-height:2px}
.chart .b.e{background:var(--bad)}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-size:22px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.search{margin-bottom:10px}
.hidden{display:none!important}
/* "≈ N millions" (centimes) under DA amounts */
.mil{display:block;font-size:11px;font-weight:500;opacity:.75;text-transform:none;letter-spacing:0;margin-top:1px}
.right{text-align:right}
.bigv{font-weight:700;font-size:18px}
/* tappable amounts → "in words" sheet */
.amt{cursor:pointer;border-radius:6px;text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}
.amt:active{background:var(--accent-soft)}
.words .wtext{font-size:20px;font-weight:650;line-height:1.45;margin-top:4px;overflow-wrap:anywhere}
.words .wtext2{font-size:16px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.words [lang="ar"]{font-size:1.1em;text-align:right}
.cvrow{display:grid;grid-template-columns:1fr 44px 1fr;gap:6px;align-items:end}
.cvswap{background:var(--surface2);color:var(--text)}
.btn.wake.on{background:var(--good-soft);color:var(--text);box-shadow:inset 0 0 0 2px var(--good)}

    sms:{accountId:null, seen:[], applied:{}, historyDone:false, dismissed:false}

/* Every future change of shape goes here; old data is converted, never dropped. */
function migrate(d){

  const out = {...base, ...d};
  out.settings = {...base.settings, ...(d.settings||{})};
  out.rates = {official:{...base.rates.official,...((d.rates||{}).official||{})},
               parallel:{...base.rates.parallel,...((d.rates||{}).parallel||{})},
               officialUpdatedAt:(d.rates||{}).officialUpdatedAt||null};
  for(const k of ['accounts','goals','debts','tx']) out[k] = Array.isArray(d[k]) ? d[k] : [];
  out.sms = {...base.sms, ...(d.sms||{})}; if(!Array.isArray(out.sms.seen)) out.sms.seen = [];
  out.goals.forEach(g => { g.contributions = Array.isArray(g.contributions) ? g.contributions : []; g.contributions.forEach(c => { if(!c.kind) c.kind = 'save'; }); });
  out.debts.forEach(x => { x.payments = Array.isArray(x.payments) ? x.payments : []; });
  if((Number(d.v) || 1) < 2) completeHistory(out);
  if(!out.sms.applied || typeof out.sms.applied !== 'object' || Array.isArray(out.sms.applied)) out.sms.applied = {};
  if((Number(d.v) || 1) < 3) smsAppliedFromTx(out);

function txEffects(tx){

    case 'income': case 'debtIn': case 'goalOut': return [[tx.accountId, tx.amount]];
    case 'expense': case 'debtPay': case 'goalIn': case 'goalPay': return [[tx.accountId, -tx.amount]];
    case 'transfer': return [[tx.accountId, -tx.amount], [tx.toAccountId, tx.toAmount]];

/**

 * created, an entry for money set aside in a goal outside any account, and the
 * source of each goal payment.

function completeHistory(st){
  const txs = st.tx; const byId = new Map(txs.map(x => [x.id, x]));
  const dateOf = ms => isoDate(ms || Date.now());
  for(const g of st.goals){
    for(const c of g.contributions){
      if(c.kind === 'pay'){ const x = byId.get(c.txId); if(x && !x.source) x.source = c.source; continue; }
      if(c.txId || !c.amount) continue;
      const x = {id:newId(), type: c.amount >= 0 ? 'goalIn' : 'goalOut', accountId:null, amount:Math.abs(c.amount), currency:g.currency,

      txs.push(x); c.txId = x.id;
    }
  }
  for(const a of st.accounts){
    let explained = 0, first = null;
    for(const x of txs){ for(const [id, delta] of txEffects(x)){ if(id === a.id){ explained += Number(delta) || 0; if(!first || x.date < first) first = x.date; } } }
    const opening = round2(a.balance - explained);
    if(Math.abs(opening) < 0.005) continue;
    const created = a.createdAt ? dateOf(a.createdAt) : null;
    const date = [created, first].filter(Boolean).sort()[0] || dateOf();
    txs.push({id:newId(), type:'opening', accountId:a.id, amount:opening, currency:a.currency, date, note:'', createdAt:(a.createdAt || 1) - 1});

}

  const U = fem ? AR_UF : AR_UM;
  if(n <= 10) return U[n];
  if(n === 11) return fem ? 'إحدى عشرة' : 'أحد عشر';
  if(n === 12) return fem ? 'اثنتا عشرة' : 'اثنا عشر';
  if(n < 20) return U[n - 10] + ' ' + (fem ? 'عشرة' : 'عشر');
  const u = n % 10; return u ? U[u] + ' و' + AR_T[Math.floor(n / 10)] : AR_T[Math.floor(n / 10)];
}
function ar999(n, fem){
  const h = Math.floor(n / 100), r = n % 100; const out = [];
  if(h) out.push(h === 2 && !r ? 'مائتا' : AR_H[h]);   // "مائتا دينار", construct before a noun
  if(r) out.push(ar99(r, fem));
  return out.join(' و');
}
/* Form of a counted noun after the number g (> 2). */
function arForm(g, forms){ const r = g % 100; return r >= 3 && r <= 10 ? forms[2] : (r >= 11 && r <= 99 ? forms[3] : forms[0]); }
function arInt(n, fem){
  const out = [];
  for(const [v, forms] of AR_SCALES){
    const g = Math.floor(n / v); n %= v; if(!g) continue;
    out.push(g === 1 ? forms[0] : g === 2 ? forms[1] : ar999(g, false) + ' ' + arForm(g, forms));
  }
  if(n) out.push(ar999(n, fem));
  return out.join(' و');
}
function arCount(n, forms, fem){
  if(n === 0) return 'صفر ' + forms[0];
  if(n === 1) return forms[0] + ' ' + (fem ? 'واحدة' : 'واحد');
  if(n === 2) return forms[1];
  // Exact thousands/millions: the scale word already carries the number (ألفان، مليونان).
  // A scale word right before the noun is in construct: ألفا دينار، خمسة عشر ألف دينار.
  const w = arInt(n, fem).replace(/(ألف|مليون|مليار)ان$/, '$1ا').replace(/(ألف|مليون|مليار)اً$/, '$1');
  return w + ' ' + arForm(n, forms);
}
/* Whole units + sub-units of an amount, e.g. 1250.5 DZD → [1250, 50]. */
function splitAmount(n, factor){ const total = Math.round(Math.abs(n) * factor); return [Math.floor(total / factor), total % factor]; }
/** "Cent cinquante mille dinars algériens", "مائة وخمسون ألف دينار جزائري"… null when too large. */
function amountInWords(n, cur, lg){
  if(!isFinite(n) || Math.abs(n) >= WORDS_MAX) return null;
  const C = WORD_CUR[cur] || {fr:[cur,cur],en:[cur,cur],ar:[cur,cur,cur,cur],sub:'cent'};
  const S = WORD_SUB[C.sub] || WORD_SUB.cent;
  const [units, subs] = splitAmount(n, C.factor || 100);
  const neg = n < 0 && (units || subs);
  let s;
  if(lg === 'ar'){
    const a = arCount(units, C.ar, C.arFem), b = subs ? arCount(subs, S.ar, S.arFem) : '';
    s = !units && subs ? b : a + (b ? ' و' + b : '');
    return (neg ? 'ناقص ' : '') + s;
  }
  if(lg === 'en'){
    const a = enCount(units, C.en), b = subs ? enCount(subs, S.en) : '';
    s = !units && subs ? b : a + (b ? ' and ' + b : '');
    s = (neg ? 'minus ' : '') + s;
  } else {
    const a = frCount(units, C.fr, C.frFem), b = subs ? frCount(subs, S.fr, false) : '';
    s = !units && subs ? b : a + (b ? ' et ' + b : '');
    s = (neg ? 'moins ' : '') + s;
  }
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/** DA as spoken in Algeria: the whole amount in centimes ("quinze millions de centimes"). */
function centimesInWords(n, lg){
  const c = Math.round(Math.abs(n) * 100); if(!c || c >= WORDS_MAX) return null;
  const S = WORD_SUB.centime; const neg = n < 0 ? {fr:'moins ',en:'minus ',ar:'ناقص '}[lg] : '';
  const s = lg === 'ar' ? arCount(c, S.ar) : lg === 'en' ? enCount(c, S.en) : frCount(c, S.fr);
  const out = neg + s; return lg === 'ar' ? out : out.charAt(0).toUpperCase() + out.slice(1);
}

/* Keep the screen on while the converter is open (Screen Wake Lock API). */
const wake = {want:false, lock:null};
function wakeSupported(){ return !!(navigator.wakeLock && navigator.wakeLock.request); }
async function wakeOn(){
  wake.want = true;
  if(!wakeSupported()){ wake.want = false; toast(t('wakeUnsupported')); updateWakeBtn(); return; }
  try{
    const lock = await navigator.wakeLock.request('screen');
    if(!wake.want){ try{ lock.release(); }catch(e){} return; }
    wake.lock = lock;
    lock.addEventListener && lock.addEventListener('release', () => { if(wake.lock === lock) wake.lock = null; updateWakeBtn(); });
  }catch(e){ wake.want = false; toast(t('wakeFailed')); }
  updateWakeBtn();
}
function wakeOff(){
  wake.want = false; const lock = wake.lock; wake.lock = null;
  if(lock){ try{ lock.release(); }catch(e){} }
  updateWakeBtn();
}
function updateWakeBtn(){
  const b = ui.wordsSheet && ui.wordsSheet.querySelector('[data-do="wake"]'); if(!b) return;
  const on = !!(wake.want && wake.lock);
  b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.textContent = on ? '🔆 ' + t('wakeOn') : '💡 ' + t('wakeOff');
}
// Android releases the lock when the app goes to the background: take it back on return.
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && wake.want && !wake.lock) wakeOn(); });

function acc(id){ return state.accounts.find(a => a.id === id); }
/* An account counts in net worth and money in/out unless the user set it "hors comptage". */
function counted(id){ const a = acc(id); return !!a && !a.excluded; }
function accLabel(id){ if(!id) return t('toNoAccount'); const a = acc(id); return a ? (ACCOUNT_TYPES[a.type]||ACCOUNT_TYPES.other).e + ' ' + a.name : '🗑 ' + t('deletedAccount'); }
/* A goal holds money set aside (an asset) and money already paid for it (gone).
   Both count towards the goal; only what is set aside counts in net worth. */
function goalHeld(g){ return r2(g.contributions.reduce((s,c)=> s + (c.kind === 'pay' ? (c.source === 'goal' ? -c.amount : 0) : c.amount), 0)); }
function goalPaid(g){ return r2(g.contributions.reduce((s,c)=> s + (c.kind === 'pay' ? c.amount : 0), 0)); }
function goalSaved(g){ return r2(goalHeld(g) + goalPaid(g)); }
function progressOf(c){ return c.kind === 'pay' ? (c.source === 'goal' ? 0 : c.amount) : c.amount; }
/* "≈ 333 millions": amounts in DA are also said in millions of centimes (10 000 DA). */
function millions(n){ const m = Math.abs(n)/10000; return fmtNum(m, m < 100 ? 1 : 0); }
function mil(n, c){ if(c !== 'DZD') return ''; const s = centimes(n); return s ? `<span class="mil">${esc(s)}</span>` : ''; }
function milPair(a, b){ if(ui.hide || !state.settings.centimes || Math.abs(b) < 10000) return ''; return '≈ ' + millions(a) + ' / ' + millions(b) + ' ' + t('millions'); }
/* Money in and out, for charts and history totals. Transfers, savings moves and adjustments are neither. */
/**
 * How a transaction changes what you own, in the reference currency: > 0 money
 * in, < 0 money out, 0 a move between your own accounts and goals. Summed over
 * all time it equals your accounts plus the money set aside in goals.
 */
function paySource(tx){
  if(tx.source) return tx.source;
  for(const g of state.goals){ const c = g.contributions.find(x => x.txId === tx.id); if(c) return c.source; }
  return 'account';
}
function flowOf(tx){
  const b = state.settings.base; const a = counted(tx.accountId) ? acc(tx.accountId) : null;
  const cur = tx.currency || (a && a.currency) || b; const v = conv(Math.abs(tx.amount), cur, b);
  switch(tx.type){
    case 'income': case 'debtIn': return a ? v : 0;
    case 'expense': case 'debtPay': return a ? -v : 0;
    case 'opening': case 'adjust': return a ? conv(tx.amount, cur, b) : 0;
    case 'transfer': { const to = counted(tx.toAccountId) ? acc(tx.toAccountId) : null;
      if(a && !to) return -v;
      if(!a && to) return conv(tx.toAmount, to.currency, b);
      return 0; }
    case 'goalIn': return a ? 0 : v;   // from outside the counted accounts
    case 'goalOut': return a ? 0 : -v;
    case 'goalPay': { const src = paySource(tx); return src === 'goal' ? -v : (src === 'account' && a ? -v : 0); }
    default: return 0;
  }
}
const isCorrection = tx => tx.type === 'opening' || tx.type === 'adjust';
function debtPaid(d){ return r2(d.payments.reduce((s,p)=> s + p.amount, 0)); }
function debtLeft(d){ return r2(Math.max(0, d.amount - debtPaid(d))); }
function daysBetween(a, b){ return Math.round((new Date(b+'T00:00') - new Date(a+'T00:00'))/86400000); }
function fmtDate(d){ if(!d) return ''; const x = new Date(d+'T00:00'); return x.toLocaleDateString(lang()==='en'?'en-GB':'fr-FR',{day:'numeric',month:'short',year:'numeric'}); }
function monthKey(d){ return d.slice(0,7); }
function monthLabel(k){ const x = new Date(k+'-01T00:00'); return x.toLocaleDateString(lang()==='en'?'en-GB':'fr-FR',{month:'long',year:'numeric'}); }

/* ---------- totals ---------- */
function totals(){
  const base = state.settings.base; let accounts=0, goals=0, paid=0, owed=0, owe=0; const byCur = {}; const byType = {};
  let excluded = 0;
  for(const a of state.accounts){ const v = conv(a.balance, a.currency, base); if(a.excluded){ excluded += v; continue; } accounts += v; byCur[a.currency] = r2((byCur[a.currency]||0) + a.balance); byType[a.type] = (byType[a.type]||0) + v; }
  for(const g of state.goals){ const h = goalHeld(g); goals += conv(h, g.currency, base); paid += conv(goalPaid(g), g.currency, base); if(h) byCur[g.currency] = r2((byCur[g.currency]||0) + h); }
  for(const d of state.debts){ const l = conv(debtLeft(d), d.currency, base); if(d.direction==='owed') owed += l; else owe += l; }
  return {base, accounts:r2(accounts), excluded:r2(excluded), goals:r2(goals), paid:r2(paid), owed:r2(owed), owe:r2(owe), net:r2(accounts+goals+owed-owe), byCur, byType};
}

/* ---------- transactions: every balance change goes through here ---------- */
function applyTx(tx, sign){
  for(const [id, delta] of txEffects(tx)){ const a = acc(id); if(a) a.balance = r2(a.balance + sign*delta); }
}
function addTx(tx){ tx.id = tx.id || uid(); tx.createdAt = tx.createdAt || Date.now(); applyTx(tx, +1); state.tx.push(tx); return tx; }
function removeTx(id){
  const i = state.tx.findIndex(x => x.id === id); if(i < 0) return;
  const tx = state.tx[i]; applyTx(tx, -1); state.tx.splice(i,1);
  // Linked goal contribution or debt payment goes with it.
  for(const g of state.goals) g.contributions = g.contributions.filter(c => c.txId !== id);
  for(const d of state.debts) d.payments = d.payments.filter(p => p.txId !== id);
}

function donut(x){
  const parts = Object.entries(x.byType).filter(([,v]) => v > 0);
  if(x.goals > 0) parts.push(['__goals', x.goals]);
  const total = parts.reduce((s,[,v])=>s+v,0); if(!total) return `<div class="muted small">—</div>`;
  const colors = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c1)'];
  let off = 0; const R = 15.9155;
  const segs = parts.map(([k,v],i) => { const p = v/total*100; const s = `<circle r="${R}" cx="21" cy="21" fill="none" stroke="${colors[i%colors.length]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-off}"></circle>`; off += p; return s; }).join('');
  const legend = parts.map(([k,v],i) => { const label = k==='__goals' ? '🎯 '+t('inGoals') : (ACCOUNT_TYPES[k]||ACCOUNT_TYPES.other).e+' '+(ACCOUNT_TYPES[k]||ACCOUNT_TYPES.other)[lang()];
    return `<div class="row small"><i class="dot" style="background:${colors[i%colors.length]}"></i><span class="grow ellipsis">${esc(label)}</span><b class="num">${Math.round(v/total*100)}%</b></div>`; }).join('');
  return `<div class="row" style="gap:16px"><svg viewBox="0 0 42 42" width="120" height="120" style="flex:none"><circle r="${R}" cx="21" cy="21" fill="none" stroke="var(--surface2)" stroke-width="6"></circle>${segs}</svg><div class="legend">${legend}</div></div>`;
}

function flowChart(){
  const b = state.settings.base; const months = [];
  const now = new Date(); for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  const data = months.map(m => { let inc=0, exp=0; for(const tx of state.tx){ if(monthKey(tx.date)!==m) continue; const f = flowOf(tx); if(f > 0) inc += f; else exp -= f; } return {m,inc,exp}; });
  const max = Math.max(1, ...data.map(d => Math.max(d.inc,d.exp)));
  const cur = data[data.length-1];
  const cols = data.map(d => { const lbl = new Date(d.m+'-01T00:00').toLocaleDateString(lang()==='en'?'en-GB':'fr-FR',{month:'short'});
    return `<div class="col"><div class="bars"><i class="b" style="height:${d.inc/max*100}%"></i><i class="b e" style="height:${d.exp/max*100}%"></i></div><div class="tiny muted">${esc(lbl)}</div></div>`; }).join('');
  return `<div class="tiny muted">${esc(t('thisMonth'))}</div>
    <div class="two"><div><b class="good num">${money(cur.inc,b,{plus:true})}</b>${mil(cur.inc,b)}</div><div class="right"><b class="bad num">${money(-cur.exp,b)}</b>${mil(cur.exp,b)}</div></div>
    <div class="chart">${cols}</div>`;
}

function goalStats(g){
  const held = goalHeld(g), paid = goalPaid(g), saved = r2(held + paid);
  const left = r2(Math.max(0, g.target - saved)); const pct = g.target ? Math.min(100, saved/g.target*100) : 0;
  let perMonth = null, daysLeft = null;
  if(g.deadline){ daysLeft = daysBetween(today(), g.deadline); if(daysLeft > 0 && left > 0) perMonth = r2(left / Math.max(1, daysLeft/30.44)); }
  // Pace: progress made over the last 90 days, projected.
  const since = new Date(); since.setDate(since.getDate()-90); const s90 = since.toISOString().slice(0,10);
  const recent = g.contributions.filter(c => c.date >= s90).reduce((s,c)=> s + progressOf(c), 0);
  let eta = null; if(left > 0 && recent > 0){ const monthly = recent/3; const m = left/monthly; const d = new Date(); d.setDate(d.getDate() + Math.ceil(m*30.44)); eta = d.toISOString().slice(0,10); }
  return {saved, held, paid, left, pct, perMonth, daysLeft, eta};
}
function goalCard(g){

  const pair = c === 'DZD' ? milPair(s.saved, g.target) : '';
  return `<div class="card goal" data-act="goalDetail" data-id="${g.id}">

function txLabel(tx){
  if(tx.type==='income'||tx.type==='expense'){ const c = (CATEGORIES[tx.type]||[]).find(x=>x[1]===tx.category); return (c?c[0]+' '+t('cat.'+c[1]):t('tx.'+tx.type)); }
  if(tx.type==='transfer') return '⇄ ' + t('tx.transfer');
  if(tx.type==='goalPay'){ const g = state.goals.find(x=>x.id===tx.goalId); return '💸 ' + (g ? g.name : t('tx.goalPay')); }
  if(tx.type==='goalIn'||tx.type==='goalOut'){ const g = state.goals.find(x=>x.id===tx.goalId); return '🎯 ' + (g?g.name:t('tx.'+tx.type)); }
  if(tx.type==='debtPay'||tx.type==='debtIn'){ const d = state.debts.find(x=>x.id===tx.debtId); return '🤝 ' + (d?d.person:t('tx.'+tx.type)); }

  if(tx.type==='transfer') return `<span class="num">${money(tx.amount,c)}</span>${mil(tx.amount,c)}`;
  return `<span class="num ${neg?'bad':'good'}">${neg?money(-Math.abs(tx.amount),c):money(Math.abs(tx.amount),c,{plus:true})}</span>${mil(tx.amount,c)}`;
}
function periodStart(){
  const d = new Date();
  if(ui.histPeriod === 'month') return today().slice(0,8) + '01';
  if(ui.histPeriod === '3m'){ d.setMonth(d.getMonth()-3); return isoDate(d.getTime()); }
  if(ui.histPeriod === 'year') return d.getFullYear() + '-01-01';
  return '';
}
function historyList(filter){
  const q = ui.histQuery.trim().toLowerCase(); const from = periodStart(); const b = state.settings.base;
  const txs = state.tx.filter(filter).filter(tx => !from || tx.date >= from)
    .filter(tx => !q || (txLabel(tx)+' '+(tx.note||'')+' '+accLabel(tx.accountId)).toLowerCase().includes(q))
    .sort((a,b)=> (b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  let inn = 0, out = 0, corrIn = 0, corrOut = 0;
  for(const tx of txs){ const f = flowOf(tx); if(f > 0){ inn += f; if(isCorrection(tx)) corrIn += f; } else if(f < 0){ out -= f; if(isCorrection(tx)) corrOut -= f; } }
  inn = r2(inn); out = r2(out); const net = r2(inn - out);
  const unfiltered = !q && ui.histType === 'all' && !ui.histAccount && ui.histPeriod === 'all';
  const incl = v => v ? `<div class="tiny muted">${esc(t('inclCorrections'))} ${money(v,b)}</div>` : '';
  const summary = `<div class="card"><div class="two">
      <div><div class="tiny muted">⬇️ ${esc(t('moneyIn'))}</div><div class="good num bigv">${money(inn,b,{plus:true})}</div>${mil(inn,b)}${incl(r2(corrIn))}</div>
      <div class="right"><div class="tiny muted">⬆️ ${esc(t('moneyOut'))}</div><div class="bad num bigv">${money(-out,b)}</div>${mil(out,b)}${incl(r2(corrOut))}</div></div>
    <div class="kv" style="margin-top:8px"><span class="muted">${esc(t('netFlow'))}</span><span class="num right ${net<0?'bad':'good'}"><b>${money(net,b,{plus:true})}</b>${mil(net,b)}</span></div>
    ${unfiltered ? `<div class="hint">${esc(t('netExplained'))}</div>` : ''}</div>`;
  if(!txs.length) return summary + `<div class="card empty"><div class="e">🧾</div><p>${esc(t('noHistory'))}</p></div>`;
  let list = '', month = '';
  for(const tx of txs){
    const m = monthKey(tx.date); if(m !== month){ if(month) list += '</div>'; month = m; list += `<div class="month"><span>${esc(monthLabel(m))}</span></div><div class="card list">`; }
    list += `<div class="item" data-act="txDetail" data-id="${tx.id}"><div class="grow"><div class="ellipsis"><b>${esc(txLabel(tx))}</b></div>
      <div class="tiny muted ellipsis">${esc(fmtDate(tx.date))} · ${esc(accLabel(tx.accountId))}${tx.type==='transfer'?' → '+esc(accLabel(tx.toAccountId)):''}${tx.note?' · '+esc(tx.note):''}</div></div><div class="amount">${txAmount(tx)}</div></div>`;
  }
  return summary + list + '</div>';
}

/* ---------- bottom sheets (with Back support) ---------- */
function openSheet(html, onMount, onClose){
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const sheet = document.createElement('div'); sheet.className = 'sheet'; sheet.setAttribute('role','dialog');
  sheet.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(scrim, sheet);
  const entry = {scrim, sheet, onClose}; ui.sheets.push(entry);
  scrim.addEventListener('click', closeSheet);
  // No automatic focus: opening the keyboard while the sheet slides in made the
  // app's WebView resize and scroll mid-animation, leaving the sheet off-screen.
  // Once the user taps a field and the keyboard is up, bring that field into view.
  sheet.addEventListener('focusin', e => {
    const field = e.target; if(!field.matches || !field.matches('input,select,textarea')) return;
    setTimeout(() => { fitViewport(); field.scrollIntoView({block:'center', behavior:'smooth'}); }, 320);
  });
  if(onMount) onMount(sheet);
  setupMilHints(sheet);
  return sheet;
}
function closeSheet(){
  const e = ui.sheets.pop(); if(!e) return false;
  if(e.onClose){ try{ e.onClose(); }catch(x){ try{ console.warn(x); }catch(y){} } }
  if(document.activeElement && e.sheet.contains(document.activeElement)) document.activeElement.blur();
  e.scrim.classList.add('closing'); e.sheet.classList.add('closing');
  setTimeout(() => { e.scrim.remove(); e.sheet.remove(); }, 230);
  return true;
}
/* "≈ N millions" under every money field, live while typing (DA amounts only). */
function milCurrency(input){
  if(input.dataset.cur) return input.dataset.cur;
  const sheet = input.closest('.sheet'); const pick = n => sheet && sheet.querySelector(`[name="${n}"]`);
  if(input.name === 'toAmount'){ const a = acc((pick('to')||{}).value); if(a) return a.currency; }
  const cur = pick('currency'); if(cur && cur.value) return cur.value;
  for(const n of ['from','account','source']){ const el = pick(n); const a = el && acc(el.value); if(a) return a.currency; }
  return input.dataset.fallbackCur || state.settings.base;
}
function updateMil(input){
  let hint = input.nextElementSibling;
  if(!hint || !hint.classList.contains('milhint')){ hint = document.createElement('div'); hint.className = 'hint milhint'; input.insertAdjacentElement('afterend', hint); }
  const v = parseAmount(input.value);
  hint.textContent = milCurrency(input) === 'DZD' && v > 0 ? centimes(v) : '';
}
function setupMilHints(root){ root.querySelectorAll('input[inputmode="decimal"]:not([data-rate]):not([data-own-mil])').forEach(updateMil); }
document.addEventListener('input', e => { const el = e.target; if(el.matches && el.matches('.sheet input[inputmode="decimal"]:not([data-rate]):not([data-own-mil])')) updateMil(el); });
document.addEventListener('change', e => { const sh = e.target.closest && e.target.closest('.sheet'); if(sh && e.target.tagName === 'SELECT') setupMilHints(sh); });

/* Keeps sheets inside what is really visible, whether the keyboard resizes the page or covers it. */
function fitViewport(){
  const root = document.documentElement.style; const vv = window.visualViewport;
  const visible = vv ? vv.height : window.innerHeight;
  const keyboard = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  root.setProperty('--vh', visible + 'px'); root.setProperty('--kb', keyboard + 'px');
}
if(window.visualViewport){ visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }
window.addEventListener('resize', fitViewport);
fitViewport();
function closeAllSheets(){ while(ui.sheets.length) closeSheet(); }
function commit(msg){ save(); closeAllSheets(); render(); if(msg) toast(msg); }
function val(sheet, name){ const el = sheet.querySelector(`[name="${name}"]`); return el ? el.value : ''; }

function smsAvailable(){ return !!(HOST && HOST.sms && HOST.permissions && HOST.permissions.has('sms')); }

}
function isoDate(ms){ const d = new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/**
 * Applies bank movements to the linked account: one income or expense each,
 * then a correction so the balance equals the one the bank reported (fees show
 * up here). Fingerprints are remembered per account, so a re-created account
 * still gets its history and nothing is counted twice. Movements older than the
 * account's first SMS are already inside its opening balance and are skipped.
 * A movement found late (missed live) is added, then the balance is reconciled
 * to the newest reported balance.
 */
function smsFp(m){ return m.fingerprint || (m.kind+'|'+m.amount+'|'+m.balance+'|'+(m.sentAt||'')); }
function smsTime(m){ return Number(m.sentAt) || Number(m.receivedAt) || 0; }
function applyMovements(list, initial){
  const a = acc(state.sms.accountId); if(!a || !Array.isArray(list)) return 0;
  const applied = new Set(state.sms.applied[a.id] || []);
  const mine = state.tx.filter(x => x.sms && x.accountId === a.id);
  mine.forEach(x => applied.add(x.sms));
  let first = mine.length ? Math.min(...mine.map(x => x.createdAt || 0)) : null;
  let last = mine.length ? Math.max(...mine.map(x => x.createdAt || 0)) : null;
  const byFp = new Map(); for(const m of list){ if(m && isFinite(Number(m.amount))){ const fp = smsFp(m); if(!byFp.has(fp)) byFp.set(fp, m); } }
  const todo = [...byFp.entries()].filter(([fp]) => !applied.has(fp)).sort((x, y) => smsTime(x[1]) - smsTime(y[1]));
  const dzd = a.currency === 'DZD'; let n = 0, late = false;
  for(const [fp, m] of todo){
    applied.add(fp);
    const at = smsTime(m) || Date.now();
    if(first != null && at < first) continue;
    const kind = m.kind === 'debit' || m.kind === 'credit' ? m.kind : (Number(m.amount) < 0 ? 'debit' : 'credit');
    const raw = Math.abs(Number(m.amount)); const amount = dzd ? r2(raw) : conv(raw, 'DZD', a.currency);
    const reported = dzd && m.balance != null && isFinite(Number(m.balance)) ? r2(Number(m.balance)) : null;
    const date = isoDate(at);
    if(initial && first == null && reported != null){
      const opening = r2(kind === 'debit' ? reported + amount : reported - amount);
      const delta = r2(opening - a.balance);
      if(delta) addTx({type:'adjust', accountId:a.id, amount:delta, currency:a.currency, date, note:t('smsOpening'), createdAt:at-1});
    }
    addTx({type: kind === 'debit' ? 'expense' : 'income', accountId:a.id, amount, currency:a.currency, category:'ccpOp', date, note:'📩 '+t('smsNote'), sms:fp, createdAt:at});
    if(last == null || at >= last){
      if(reported != null){ const delta = r2(reported - a.balance); if(delta) addTx({type:'adjust', accountId:a.id, amount:delta, currency:a.currency, date, note:t('smsGap'), createdAt:at+1}); }
      last = at;
    } else late = true;
    if(first == null) first = at;
    n++;
  }
  if(late && dzd){
    const newest = [...byFp.entries()].filter(([fp, m]) => applied.has(fp) && smsTime(m) >= first && m.balance != null && isFinite(Number(m.balance)))
      .sort((x, y) => smsTime(y[1]) - smsTime(x[1]))[0];
    if(newest){ const at = smsTime(newest[1]); const delta = r2(r2(Number(newest[1].balance)) - a.balance);
      if(delta) addTx({type:'adjust', accountId:a.id, amount:delta, currency:a.currency, date:isoDate(at), note:t('smsGap'), createdAt:at+2}); }
  }
  state.sms.applied[a.id] = [...applied].slice(-5000);
  return n;
}
let smsBusy = false;
async function smsSync(announceEmpty){
  if(!smsAvailable() || smsBusy) return; smsBusy = true;
  try{
    ui.smsStatus = await HOST.sms.status();
    if(!ui.smsStatus || !ui.smsStatus.granted) return;
    if(!acc(state.sms.accountId)){ const p = await HOST.sms.pending(); ui.smsWaiting = p.length; if(ui.tab==='home') render(); return; }
    let added = 0;
    // The inbox is read on every sync: an SMS missed by the live queue is still found.
    added += applyMovements(await HOST.sms.history(), !state.sms.historyDone); state.sms.historyDone = true;
    const pending = await HOST.sms.pending();
    added += applyMovements(pending, false);
    flush(); // saved before acknowledging: a crash can repeat, never lose
    const upTo = pending.reduce((m,e)=> Math.max(m, e.seq||0), 0); if(upTo) await HOST.sms.ack(upTo);
    ui.smsWaiting = 0;
    if(added){ render(); toast(t('smsImported').replace('{n}', added)); }
    else if(announceEmpty) toast(t('smsNothing'));
  }catch(e){ try{ console.warn('SMS sync failed', e); }catch(x){} }
  finally{ smsBusy = false; }
}

    <button class="btn ghost block" data-do="create" style="margin-top:8px">📮 ${esc(t('smsCreateCcp'))}</button>
    <div class="hint">${esc(t('smsNoCodes'))}</div>
    <div class="btns"><button class="btn" data-do="ok">${esc(t('smsConnect'))}</button></div>`);
  sheet.addEventListener('click', async e => {
    const d = e.target.closest('[data-do]'); if(!d) return;
    if(d.dataset.do === 'grant'){
      ui.smsStatus = await HOST.sms.requestAccess();
      sheet.querySelector('#smsState').textContent = ui.smsStatus && ui.smsStatus.granted ? t('smsGranted') : t('smsNotGranted');
      if(!(ui.smsStatus && ui.smsStatus.granted)) toast(t('smsDenied'));
    }
    if(d.dataset.do === 'create'){
      const a = {id:uid(), name:'CCP', type:'ccp', currency:'DZD', balance:0, createdAt:Date.now()}; state.accounts.push(a); save();
      const sel = sheet.querySelector('[name="account"]'); sel.insertAdjacentHTML('beforeend', `<option value="${a.id}">${esc(accLabel(a.id))} (DZD)</option>`); sel.value = a.id;
    }
    if(d.dataset.do === 'ok'){
      const id = val(sheet,'account'); if(!acc(id)){ toast(t('smsChoose')); return; }
      if(!(ui.smsStatus && ui.smsStatus.granted)){ ui.smsStatus = await HOST.sms.requestAccess(); if(!(ui.smsStatus && ui.smsStatus.granted)){ toast(t('smsDenied')); return; } }
      if(state.sms.accountId !== id){ state.sms.accountId = id; state.sms.historyDone = false; }
      commit(); await smsSync(true);
    }
  });
}

/* ---------- rates, export, import ---------- */
async function fetchRates(){
  if(HOST && HOST.permissions && !HOST.permissions.has('internet')){ toast(t('noInternet')); return; }
  try{
    const res = await fetch('https://open.er-api.com/v6/latest/DZD'); if(!res.ok) throw new Error(res.status);
    const j = await res.json(); if(!j || !j.rates) throw new Error('bad');
    for(const c of Object.keys(CURRENCIES)){ if(c !== 'DZD' && j.rates[c]) state.rates.official[c] = r2(1 / j.rates[c]); }
    state.rates.officialUpdatedAt = new Date().toISOString(); save(); render(); toast(t('updated'));
  }catch(e){ toast(t('updateFailed')); }
}
async function saveOut(name, data, mime){
  if(HOST && HOST.saveFile){ const ok = await HOST.saveFile(name, data, mime); toast(ok ? t('backupSaved') : t('backupFailed')); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data],{type:mime})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportJson(){ flush(); saveOut(`mes-finances-${today()}.json`, JSON.stringify({app:APP_ID, v:SCHEMA, date:new Date().toISOString(), data:state}, null, 2), 'application/json'); }
function exportCsv(){
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const rows = [['date','type','label','account','to_account','amount','currency','received','note'].join(',')];
  for(const tx of state.tx.slice().sort((a,b)=> a.date.localeCompare(b.date))){
    const a = acc(tx.accountId), b = acc(tx.toAccountId);
    rows.push([tx.date, tx.type, q(txLabel(tx)), q(a?a.name:''), q(b?b.name:''), tx.amount, a?a.currency:(tx.currency||''), tx.toAmount ?? '', q(tx.note)].join(','));
  }
  saveOut(`mes-finances-${today()}.csv`, '\ufeff' + rows.join('\n'), 'text/csv');
}
/* File.text() where available, FileReader on older WebViews. */
function readText(f){
  if(typeof f.text === 'function') return f.text();
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = () => ko(r.error); r.readAsText(f); });
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const j = JSON.parse(await readText(f));
    if(!j || j.app !== APP_ID || !j.data || !Array.isArray(j.data.accounts)) throw new Error('shape');
    if(!confirm(t('restoreConfirm'))) return;
    state = migrate(j.data); flush(); ui.hide = !!state.settings.hideOnStart; closeAllSheets(); render(); toast(t('restored'));
  }catch(err){ toast(t('badBackup')); }
});

/* ---------- actions (event delegation) ---------- */
const ACT = {
  tab:d => { ui.tab = d.tab; closeAllSheets(); render(); window.scrollTo(0,0); },
  toggleHide:() => { ui.hide = !ui.hide; render(); },
  fab:() => ({accounts:accountForm, goals:goalForm, debts:debtForm}[ui.tab]||(()=>{}))(),
  accountForm:() => accountForm(), accountDetail:d => accountDetail(d.id),
  words:() => wordsForm(null, state.settings.base),
  convert:() => convertForm(),
  txForm:d => txForm(d.type), transferForm:() => transferForm(), quickSave,
  goalForm:() => goalForm(), goalDetail:d => goalDetail(d.id),
  debtForm:() => debtForm(), debtDetail:d => debtDetail(d.id), debtSeg:d => { ui.debtSeg = d.seg; render(); },
  txDetail:d => txDetail(d.id), histType:d => { ui.histType = d.type; render(); },
  histPeriod:d => { ui.histPeriod = d.p; render(); },
  rateMode:d => { state.settings.rateMode = d.mode; save(); render(); },
  fetchRates, exportJson, exportCsv, importJson:() => $('#file').click(),
  toggleCur:d => { const s = state.settings; const c = d.cur;
    if(s.currencies.includes(c)){ const used = state.accounts.some(a=>a.currency===c) || state.goals.some(g=>g.currency===c) || state.debts.some(x=>x.currency===c); if(used || c===s.base || s.currencies.length===1) return toast('🔒 ' + c); s.currencies = s.currencies.filter(x=>x!==c); }
    else s.currencies.push(c);
    save(); render(); },
  smsSetup:() => smsSetupForm(),
  smsDismiss:() => { state.sms.dismissed = true; save(); render(); },
  smsSyncNow:() => smsSync(true),
  resetAll:() => { if(!confirm(t('resetConfirm'))) return; state = defaults(); flush(); ui.tab = 'home'; render(); toast(t('deleted')); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.closest('.sheet')) return;
  const fn = ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input; if(!k) return;
  // Only the list is redrawn, so the search field keeps focus and the keyboard stays.
  if(k === 'histQuery'){ ui.histQuery = e.target.value; const box = $('#histList'); if(box) box.innerHTML = historyList(histFilter); }
});
document.addEventListener('change', e => {
  const el = e.target; const k = el.dataset && el.dataset.input; const s = state.settings;
  if(el.dataset && el.dataset.rate){ const v = parseAmount(el.value); if(v > 0){ state.rates[s.rateMode][el.dataset.rate] = v; save(); render(); } return; }
  if(!k) return;
  if(k === 'histAccount'){ ui.histAccount = el.value; render(); return; }
  if(k === 'base'){ s.base = el.value; }
  if(k === 'lang'){ s.lang = el.value; }
  if(k === 'hideOnStart'){ s.hideOnStart = el.checked; }
  if(k === 'centimes'){ s.centimes = el.checked; }
  save(); render();
});

/* ---------- host: theme & back ---------- */
function applyTheme(th){ document.documentElement.dataset.theme = th === 'dark' ? 'dark' : 'light'; }
if(HOST){ applyTheme(HOST.theme); if(HOST.onThemeChange) HOST.onThemeChange(applyTheme);
  if(HOST.onBack) HOST.onBack(() => { if(ui.sheets.length){ closeSheet(); return true; } if(ui.tab !== 'home'){ ui.tab = 'home'; render(); return true; } return false; }); }
else { const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null; applyTheme(mq && mq.matches ? 'dark' : 'light'); if(mq && mq.addEventListener) mq.addEventListener('change', e => applyTheme(e.matches ? 'dark' : 'light')); }

render();
// Bank SMS: apply what arrived while closed, then keep up while open.
if(smsAvailable()){
  smsSync(false).then(() => { if(ui.tab === 'home' || ui.tab === 'more') render(); });
  HOST.sms.onMessage(() => smsSync(false));
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') smsSync(false); });
}
</script>
</body>
</html>
