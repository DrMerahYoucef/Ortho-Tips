<style>

:root{
  --bg:#f5f7f4;--surface:#fff;--surface2:#eef2ec;--text:#1b1f1c;--muted:#5b675e;--line:#dfe5dc;
  --accent:#27702b;--on-accent:#ffffff;--accent-soft:#e3f1e4;--good:#1e7a45;--good-soft:#e2f4ea;--bad:#c62828;--bad-soft:#fdecec;
  --warn:#8a5300;--warn-soft:#fff1d6;--water:#0b67a8;--water-soft:#e2f0fb;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --radius:16px;--nav:64px;
}
html[data-theme="dark"]{
  --bg:#111412;--surface:#1b201c;--surface2:#252c26;--text:#e5ebe5;--muted:#a4b0a6;--line:#303a32;
  --accent:#81c784;--on-accent:#0f1a10;--accent-soft:#223a25;--good:#6fd69b;--good-soft:#193528;--bad:#ff8a80;--bad-soft:#3d2020;
  --warn:#ffc15e;--warn-soft:#3a2e17;--water:#7cc4f5;--water-soft:#16303f;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Roboto,sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
main{padding:12px 16px 88px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-size:22px;margin:12px 0 2px;overflow-wrap:anywhere}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;font-weight:600}
h3{margin:0 0 10px;font-size:18px}
h4{margin:12px 0 4px;font-size:14px}
p{margin:6px 0}
ul,ol{margin:6px 0;padding-left:20px}
li{margin:3px 0}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.water{background:var(--water-soft);color:var(--water)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:0;border-radius:12px;min-height:44px;padding:0 16px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.water{background:var(--water-soft);color:var(--water)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.icon-btn{min-width:44px;min-height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;min-height:40px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:var(--shadow)}
.pcard .body{padding:8px 10px 10px}
.pcard .name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sci{font-size:12px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.ph{position:relative;aspect-ratio:1/1;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph img:not([src]){display:none}
.ph.wide{aspect-ratio:4/3;border-radius:var(--radius);font-size:64px}
.thumb{width:48px;height:48px;border-radius:12px;flex:none;aspect-ratio:auto;font-size:24px}
.list .item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);min-height:56px}
.list .item:first-child{border-top:0}
.list .item.click{cursor:pointer}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .e{font-size:44px}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font-weight:600;background:var(--water-soft);color:var(--water);border-color:transparent}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner .e{font-size:26px}
.kv{padding:8px 0;border-top:1px dashed var(--line)}
.kv:first-child{border-top:0}
.kv b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.big{font-size:20px;font-weight:700}
.aibox{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--surface2)}
.aibox.err{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button span{font-size:20px;line-height:1;padding:3px 14px;border-radius:99px}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.on span{background:var(--accent-soft)}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* sheets: the resting state is the visible state; --vh / --kb come from visualViewport */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fade-in .2s ease both}
.scrim.closing{animation:fade-out .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);max-height:calc(var(--vh,100vh) - 24px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;z-index:21;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:sheet-in .25s ease both;max-width:720px;margin:0 auto}
.sheet.closing{animation:sheet-out .22s ease both}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheet-out{from{transform:none}to{transform:translateY(100%)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet,.scrim,.spin{animation:none}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
label.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.input,select.input,textarea.input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;outline:none}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log{border-left:4px solid var(--line);padding:8px 10px;margin:8px 0;background:var(--surface2);border-radius:0 10px 10px 0}
.log.error{border-left-color:var(--bad)}.log.warn{border-left-color:var(--warn)}.log.info{border-left-color:var(--water)}
.log pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0;font:12px/1.4 ui-monospace,"Roboto Mono",monospace;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600}
a{color:var(--accent)}
.switch{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.hidden{display:none!important}

/* ---------- Import PowerPoint ---------- */
:root{--accent:#1b5cb8;--on-accent:#ffffff;--accent-soft:#e2ebf8;
  --g-id:#d9e6ff;--g-contact:#d3f0ec;--g-ins:#e9e9e9;--g-hist:#eadcff;--g-ortho:#ffe0c2}
html[data-theme="dark"]{--accent:#8ab4f8;--on-accent:#0b1a33;--accent-soft:#1c2c46;
  --g-id:#233a60;--g-contact:#173c38;--g-ins:#383838;--g-hist:#3a2c57;--g-ortho:#4d3417}
.warnbox{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.hintcard{background:var(--accent-soft);border-color:transparent}
.acc-t{color:var(--accent)}
.mthumb[data-do="view"]{cursor:zoom-in}
.mthumb[data-do="view"]::after{content:'🔍';position:absolute;right:2px;bottom:2px;font-size:12px;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 3px}
/* full-screen viewer */
.sheet.full{top:0;bottom:0;max-height:none;height:var(--vh,100vh);border-radius:0;display:flex;flex-direction:column;max-width:none}
.sheet.full .grab{display:none}
.viewer-sheet{background:#000;color:#fff;padding:0 0 env(safe-area-inset-bottom)}
.vtop,.vbar{display:flex;align-items:center;gap:6px;padding:6px 8px}
.vbar{justify-content:center}
.vbtn{min-width:48px;min-height:48px;border:0;border-radius:12px;background:#1d1f23;color:#fff;font-size:20px;cursor:pointer}
.vbtn.wide{min-width:84px;font-size:14px;font-weight:600}
.vbtn:disabled{opacity:.35}
.vmuted{color:#b9c0c9}
.vstage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#000;cursor:zoom-in}
.vstage.zoomed{cursor:grab}
.vimg{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}
.vvid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#d8dde3}
.vctl{padding:8px 12px 10px;background:#111317}
.vcheck{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px}
.vcheck input{width:22px;height:22px;accent-color:#8ab4f8;flex:none}
.vchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.vchip{min-height:44px;border:1px solid #4a4f57;border-radius:999px;background:#1d1f23;color:#fff;padding:0 12px;font-size:13px;cursor:pointer}
.vchip.on{background:#8ab4f8;border-color:#8ab4f8;color:#0b1a33;font-weight:700}
.estbox{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:8px 0}
.estbox .big{margin-top:6px}
.usagebox{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}.bad-t{color:var(--bad)}.good-t{color:var(--good)}.warn-t{color:var(--warn)}
.pill.muted{background:var(--surface2);color:var(--muted)}
.tool-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.tool{flex:none;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;padding:0 12px;white-space:nowrap;cursor:pointer}
.slide{background:var(--surface);border:1px solid var(--line);border-left:5px solid hsl(var(--hue,210) 60% 50%);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.slide.out{border-left-color:var(--line);opacity:.72}
.band{display:flex;align-items:center;gap:8px;background:hsl(var(--hue,210) 70% 50% / .14);border-radius:10px;padding:8px 10px;margin:-2px 0 8px}
.small-btn{min-height:40px;padding:0 10px;font-size:13px}
.slide-h{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:13px}
.para{margin:2px 0;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.ln{display:block;padding:9px 8px;min-height:40px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.ln + .ln{margin-top:2px}
.ln.picked{border-color:var(--accent);background:var(--accent-soft)}
.ln.noise{min-height:0;padding:2px 8px;font-size:12px;color:var(--muted);cursor:default}
.para.ttl{font-weight:700;font-size:16px}
.para.nts{font-style:italic;color:var(--muted);background:var(--surface2)}

mark.mk{color:var(--text);border-radius:4px;padding:0 2px;cursor:pointer}
mark.mk.multi{box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}
.g-id{background:var(--g-id)}.g-contact{background:var(--g-contact)}.g-ins{background:var(--g-ins)}.g-hist{background:var(--g-hist)}.g-ortho{background:var(--g-ortho)}
.chip.g-id,.chip.g-contact,.chip.g-ins,.chip.g-hist,.chip.g-ortho{border-color:transparent;color:var(--text)}
sup.mt{font-size:10px;font-weight:700;margin-left:3px;color:var(--muted);font-style:normal;-webkit-user-select:none;user-select:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.mtile{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:12px;background:var(--surface2);font-size:28px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:var(--text)}
.mtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mtile img:not([src]){display:none}
.mtile .ml{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile.offm{opacity:.5}
.mtile .mx{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;display:flex;align-items:center;justify-content:center}
#bar{position:fixed;max-width:100%;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:15;background:var(--surface);border-top:2px solid var(--accent);padding:6px 10px 8px;box-shadow:0 -4px 14px rgba(0,0,0,.15);animation:fade-in .15s ease both}
#bar{max-height:calc(var(--vh,100vh) * .62);overflow-y:auto}
.tgtrow{display:flex;gap:6px;margin:4px 0;overflow-x:auto}
.tgt{flex:1 1 auto;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:600 13px/1.2 inherit;padding:4px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.tgt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tgt.icon{flex:0 0 44px;max-width:44px;font-size:16px;padding:0}
#barHint:empty{display:none}
#barHint{margin:0 0 4px}
.fchip.has{box-shadow:inset 0 0 0 2px var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.menu-btn{margin-top:8px;text-align:left;justify-content:flex-start}
#snack{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));z-index:30;background:#2b2f36;color:#fff;border-radius:12px;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;box-shadow:0 4px 16px rgba(0,0,0,.35);animation:fade-in .15s ease both}
body.bar-open #snack{bottom:calc(var(--nav) + var(--barh,0px) + 10px + env(safe-area-inset-bottom))}
#snack .st{flex:1;font-size:14px}
#snack button{min-height:44px;border:0;background:none;color:#9cc2ff;font-weight:700;padding:0 12px;cursor:pointer;text-transform:uppercase}
.wshead{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:4px;background:var(--bg);margin:-12px -16px 8px;padding:6px 8px;border-bottom:1px solid var(--line)}
.slide-h .slide-menu{min-width:44px;min-height:40px;font-size:18px;margin:-6px -6px -6px 0}
.dotc{width:14px;height:14px;border-radius:50%;flex:none;background:hsl(var(--hue) 60% 50%)}
#barChips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:calc(var(--vh,100vh) * .5);overflow-y:auto;padding:2px 0}
.fchip{min-height:44px;border:0;border-radius:10px;padding:4px 3px;font:600 13px/1.15 inherit;color:var(--text);cursor:pointer;overflow-wrap:anywhere;hyphens:auto}
.fchip:active{outline:2px solid var(--accent)}
@media (min-width:600px){#barChips{grid-template-columns:repeat(6,1fr)}}
.barspace{height:calc(var(--barh,0px) + 120px)}
.pickbox{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px}
.pickbox input,.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.radio{align-items:flex-start;padding:6px 0}
.radio input{margin-top:2px}
.row-item{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);min-height:56px}
.row-item:first-child{border-top:0}
.click{cursor:pointer}
.stickybar{position:sticky;bottom:calc(var(--nav) + 8px);display:flex;gap:8px;background:var(--bg);padding:8px 0}
.stickybar .btn{flex:1}
.frow{padding:6px 0;border-top:1px dashed var(--line)}
.frow .input{margin-top:2px}
.mlist .mrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.mthumb{position:relative;width:64px;height:64px;flex:none;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.mthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mthumb img:not([src]){display:none}
.small-in{min-height:40px;padding:6px 8px;font-size:13px;margin-top:4px}
.viewer img,.viewer video{width:100%;border-radius:12px;display:block;background:#000;margin-bottom:8px}
.bubble{background:var(--accent-soft);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.item{padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
</style>

<body>
<main id="view" aria-live="polite"></main>
<div id="bar" class="hidden" role="toolbar"><div class="row"><span class="grow ellipsis small" id="barText"></span><button class="icon-btn" type="button" data-act="clearSel" aria-label="✕">✕</button></div>
  <div class="tgtrow" id="barTarget"></div><div class="tiny acc-t" id="barHint"></div><div id="barChips"></div></div>
<div id="snack" class="hidden" role="status" aria-live="polite"><span class="st"></span><button type="button" data-act="undo"></button></div>
<nav class="tabs" id="tabs"></nav>
<input type="file" id="pickPptx" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" multiple class="hidden">
<input type="file" id="pickJson" accept="application/json,.json" class="hidden">
<script>
'use strict';
/* =====================================================================
   Import PowerPoint — Ortho Tips extension
   Keys: <id>:state (JSON), <id>:apikey, <id>:log. Slide text and media
   extracted from each .pptx live in OrthoTips.files (content/, media/).

/* ---------- inflate (raw DEFLATE, RFC 1951): fallback when DecompressionStream is missing ---------- */
const LBASE = [3, 4, 5, 6, 7, 8, 9, 10, 11, 13, 15, 17, 19, 23, 27, 31, 35, 43, 51, 59, 67, 83, 99, 115, 131, 163, 195, 227, 258];

function inflateJS(src, size){

    for(let i = 0; i < n; i++) counts[lens[i]]++; counts[0] = 0; for(let i = 1; i < 16; i++) offs[i] = offs[i - 1] + counts[i - 1];
    for(let i = 0; i < n; i++) if(lens[i]) syms[offs[lens[i]]++] = i; return {counts, syms}; };
  const decode = h => { let code = 0, first = 0, index = 0;
    for(let len = 1; len < 16; len++){ code |= bits(1); const c = h.counts[len]; if(code - c < first) return h.syms[index + code - first]; index += c; first += c; first <<= 1; code <<= 1; }
    throw new Error('inflate: bad code'); };

      const len = src[ip] | (src[ip + 1] << 8); ip += 4;
      if(ip + len > src.length) throw new Error('inflate: truncated data');

      const cl = new Uint8Array(19); for(let i = 0; i < hc; i++) cl[order[i]] = bits(3);

      const len = LBASE[s] + bits(LEXT[s]), ds = decode(D); if(ds >= 30) throw new Error('inflate: bad distance');
      const dist = DBASE[ds] + bits(DEXT[ds]); if(dist > op) throw new Error('inflate: distance too far');
      grow(len); for(let k = 0; k < len; k++, op++) out[op] = out[op - dist];

}
async function inflateRaw(data, size){
  if(typeof DecompressionStream === 'function'){
    try{
      const ds = new DecompressionStream('deflate-raw'), w = ds.writable.getWriter(), r = ds.readable.getReader(), parts = [];
      w.write(data).catch(() => {}); w.close().catch(() => {});
      let n = 0; for(;;){ const {value, done} = await r.read(); if(done) break; parts.push(value); n += value.length; }
      const out = new Uint8Array(n); let o = 0; for(const p of parts){ out.set(p, o); o += p.length; }
      return out;
    }catch(e){ /* older WebView without 'deflate-raw': use the built-in inflater */ }
  }
  return inflateJS(data, size);
}

/* ---------- ZIP (central directory) ---------- */
function readZip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let e = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if(dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if(e < 0) throw new Error('not-zip');
  const n = dv.getUint16(e + 10, true), entries = new Map();
  let off = dv.getUint32(e + 16, true);
  if(off === 0xffffffff) throw new Error('zip64');
  const dec = new TextDecoder();
  for(let k = 0; k < n; k++){
    if(off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) throw new Error('bad-zip');
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true), usize = dv.getUint32(off + 24, true);
    const nl = dv.getUint16(off + 28, true), xl = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
    if(csize === 0xffffffff || lho === 0xffffffff) throw new Error('zip64');
    entries.set(dec.decode(u8.subarray(off + 46, off + 46 + nl)), {method, csize, usize, lho});
    off += 46 + nl + xl + cl;
  }
  return {u8, dv, entries};
}
async function zipGet(z, name){
  const e = z.entries.get(name); if(!e) return null;
  if(z.dv.getUint32(e.lho, true) !== 0x04034b50) throw new Error('bad-zip');
  const start = e.lho + 30 + z.dv.getUint16(e.lho + 26, true) + z.dv.getUint16(e.lho + 28, true);
  const data = z.u8.subarray(start, start + e.csize);
  if(e.method === 0) return data.slice();
  if(e.method === 8) return inflateRaw(data, e.usize);
  throw new Error('zip-method-' + e.method);
}

/* ---------- PowerPoint ---------- */
const NS_REL = /\/relationships\/(image|video|media|audio|notesSlide)$/;
function resolvePath(base, target){
  if(target.startsWith('/')) return target.slice(1);
  const parts = base.split('/'); parts.pop();
  for(const seg of target.split('/')){ if(seg === '..') parts.pop(); else if(seg && seg !== '.') parts.push(seg); }
  return parts.join('/');
}
function parseXml(s){ return new DOMParser().parseFromString(s, 'application/xml'); }
function relsOf(xmlText, partPath){
  const out = {};
  if(!xmlText) return out;
  for(const r of parseXml(xmlText).getElementsByTagName('Relationship')){
    const ext = r.getAttribute('TargetMode') === 'External', target = r.getAttribute('Target') || '';
    out[r.getAttribute('Id')] = {type:r.getAttribute('Type') || '', external:ext, path:ext ? target : resolvePath(partPath, target)};
  }
  return out;
}
function relsPath(part){ const i = part.lastIndexOf('/'); return part.slice(0, i) + '/_rels/' + part.slice(i + 1) + '.rels'; }
function paraText(p){
  let s = '';
  const walk = n => { for(const c of n.childNodes){ if(c.nodeType !== 1) continue; const tag = c.localName || c.nodeName.replace(/^.*:/, '');
    if(tag === 't') s += c.textContent; else if(tag === 'br') s += '\n'; else if(tag === 'tab') s += '\t'; else walk(c); } };
  walk(p);
  return s.replace(/[ \t\u00a0]+/g, ' ').replace(/ *\n */g, '\n').trim();
}
function isTitleShape(sp){
  for(const ph of sp.getElementsByTagName('p:ph')){ const t = ph.getAttribute('type'); if(t === 'title' || t === 'ctrTitle') return true; }
  return false;
}
function slideParas(doc, notes){
  const out = [];
  for(const p of doc.getElementsByTagName('a:p')){
    const t = paraText(p); if(!t) continue;
    let sp = p.parentNode; while(sp && sp.nodeName !== 'p:sp') sp = sp.parentNode;
    const ph = sp ? sp.getElementsByTagName('p:ph')[0] : null, pht = ph ? ph.getAttribute('type') : null;
    if(notes && ph && pht !== 'body') continue;
    if(!notes && ['dt', 'ftr', 'sldNum'].includes(pht)) continue;          // date, footer, slide number: layout, not content
    out.push({t, title:!notes && !!sp && isTitleShape(sp), notes:!!notes});
  }
  return out;
}
function mediaInfo(path, size, types){
  const name = path.split('/').pop(), ext = (name.split('.').pop() || '').toLowerCase();
  const declared = (types.over['/' + path] || types.def[ext] || '').toLowerCase();
  let mime = IMG_OK[ext] || VID_OK[ext] || declared || 'application/octet-stream', kind = null, why = null;
  if(IMG_OK[ext]) kind = 'image'; else if(VID_OK[ext]) kind = 'video';
  else why = /emf|wmf/.test(ext + declared) ? 'drawing' : 'format';
  if(kind && size > MEDIA_MAX) why = 'tooBig';
  return {name, ext, mime, kind, size, ok:!!kind && !why, why};
}
/* Reads a .pptx: slides in presentation order, their text (+ speaker notes) and media. */
async function parsePptx(buf, onProgress){
  const z = readZip(buf), txt = async n => { const b = await zipGet(z, n); return b ? new TextDecoder().decode(b) : null; };
  const types = {def:{}, over:{}};
  const ct = await txt('[Content_Types].xml');
  if(ct){ const d = parseXml(ct);
    for(const x of d.getElementsByTagName('Default')) types.def[(x.getAttribute('Extension') || '').toLowerCase()] = x.getAttribute('ContentType') || '';
    for(const x of d.getElementsByTagName('Override')) types.over[x.getAttribute('PartName') || ''] = x.getAttribute('ContentType') || ''; }
  let order = [];
  const pres = await txt('ppt/presentation.xml');
  if(pres){ const rels = relsOf(await txt('ppt/_rels/presentation.xml.rels'), 'ppt/presentation.xml');
    for(const s of parseXml(pres).getElementsByTagName('p:sldId')){ const r = rels[s.getAttribute('r:id')]; if(r && z.entries.has(r.path)) order.push(r.path); } }
  if(!order.length) order = [...z.entries.keys()].filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a, b) => parseInt(a.match(/\d+/)[0], 10) - parseInt(b.match(/\d+/)[0], 10));
  if(!order.length) throw new Error('no-slides');
  const media = {}, byPath = {}, slides = [];
  let mi = 0;
  for(let i = 0; i < order.length; i++){
    const part = order[i], xmlText = await txt(part), doc = parseXml(xmlText || '<x/>');
    const rels = relsOf(await txt(relsPath(part)), part);
    const root = doc.documentElement, hidden = root && root.getAttribute('show') === '0';
    const paras = slideParas(doc, false);
    for(const r of Object.values(rels)) if(/notesSlide$/.test(r.type) && !r.external){
      const nx = await txt(r.path); if(nx) paras.push(...slideParas(parseXml(nx), true)); }
    const ids = [], seen = new Set();
    for(const el of doc.getElementsByTagName('*')) for(const a of ['r:embed', 'r:link', 'r:id']){
      const id = el.getAttribute(a); if(id && !seen.has(id) && rels[id] && /\/(image|video|media)$/.test(rels[id].type)){ seen.add(id); ids.push(id); } }
    const mids = [];
    for(const id of ids){
      const r = rels[id];
      if(r.external){ continue; }
      if(!byPath[r.path]){
        const e = z.entries.get(r.path); if(!e) continue;
        const mid = 'm' + (++mi);
        byPath[r.path] = mid; media[mid] = Object.assign({mid, path:r.path}, mediaInfo(r.path, e.usize, types));
      }
      if(!mids.includes(byPath[r.path])) mids.push(byPath[r.path]);
    }
    slides.push({n:parseInt((part.match(/(\d+)\.xml$/) || [0, i + 1])[1], 10), hidden, paras, media:mids});
    if(onProgress) onProgress(i + 1, order.length);
  }
  // Presentation date (used to turn an age into an approximate birth year).
  let date = null;
  const core = await txt('docProps/core.xml');
  if(core){ const m = core.match(/<dcterms:(?:modified|created)[^>]*>(\d{4}-\d{2}-\d{2})/); if(m) date = m[1]; }
  return {slides, media, zip:z, date};
}
async function mediaBytes(z, m){ return zipGet(z, m.path); }

/* ---------- text helpers ---------- */
function norm(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[’`´]/g, "'").replace(/\s+/g, ' ').trim(); }
const MONTHS = {janv:1, jan:1, janvier:1, january:1, fevr:2, fev:2, feb:2, fevrier:2, february:2, mars:3, mar:3, march:3, avr:4, apr:4, avril:4, april:4, mai:5, may:5,

function ymd(y, m, d){

/* ---------- dates (local calendar days) ---------- */
function isoDay(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today(){ return isoDay(new Date()); }

  if(m < 60) return rtf.format(-m, 'minute'); if(m < 1440) return rtf.format(-Math.round(m / 60), 'hour'); return rtf.format(-Math.round(m / 1440), 'day'); }


/* ---------- storage of what was extracted: slide text (JSON) and media (bytes) ---------- */
const Store = {
  files(){ return !!(HOST && HOST.permissions.has('storage')); },
  mem:new Map(),
  async putText(path, text){ if(this.files()) await HOST.files.write(path, text); else storeSet(KEY_BLOB + path, text); },
  async getText(path){ try{ return this.files() ? await HOST.files.read(path) : storeGet(KEY_BLOB + path); }catch(e){ log('warn', 'storage', 'Not readable: ' + path, String(e && e.message)); return null; } },
  async putBytes(path, bytes){ if(this.files()) await HOST.files.write(path, bytes); else this.mem.set(path, bytes); },
  async getBytes(path){
    if(!this.files()) return this.mem.get(path) || null;

  },

  async list(prefix){ if(!this.files()) return [...this.mem.keys()].filter(k => k.startsWith(prefix)); try{ return (await HOST.files.list(prefix)) || []; }catch(e){ return []; } }

const contents = new Map();
async function ensureContent(fid){

/* ---------- files and drafts ---------- */
function fileById(id){ return state.files.find(f => f.id === id) || null; }
function draftById(id){ return state.drafts.find(d => d.id === id) || null; }
function draftsOf(fid){ return state.drafts.filter(d => d.fileId === fid).sort((a, b) => a.start - b.start); }
function rangeOf(d){
  const f = fileById(d.fileId), list = draftsOf(d.fileId), i = list.indexOf(d), next = list[i + 1];
  let end = Math.max(0, (f ? f.slides : 1) - 1);
  if(next) end = Math.min(end, next.start - 1);
  if(d.end != null) end = Math.min(end, d.end);

}
function draftAt(fid, s){ return draftsOf(fid).find(d => { const [a, b] = rangeOf(d); return s >= a && s <= b; }) || null; }

/* Final values of a draft: slide highlights, then the user's edits (or Gemini's), cleaned up,

function valuesInfo(d, content){
  const f = fileById(d.fileId), [a, b] = rangeOf(d);
  const v = Object.assign(content ? composeFields(content, f ? f.marks : [], a, b) : {}, d.edits);
  for(const k of Object.keys(v)) v[k] = cleanValue(k, v[k]);
  if(v.gender) v.gender = normGender(v.gender, lang());
  const why = {};
  if(content && !('dateOfBirth' in d.edits)){   // an age chosen as the birth date: say it is approximate
    const dm = (f ? f.marks : []).filter(m => m.f === 'dateOfBirth' && m.s >= a && m.s <= b).sort((x, y) => x.s - y.s || x.p - y.p || x.a - y.a).pop();
    if(dm){ const raw = content.slides[dm.s].paras[dm.p].t.slice(dm.a, dm.b);
      if(!normDate(raw)){ const x = approxDobFromAge(raw, content.date); if(x) why.dateOfBirth = {age:x.age, year:x.year}; } }
  }
  if(content){
    const r = derive(v, rangeText(content, a, b), content.date || null);
    for(const [k, val] of Object.entries(r.values)) if(!(k in d.edits) && !v[k]){ v[k] = val; why[k] = r.why[k]; }
    if(why.dateOfBirth){
      const line = t('approxDob', {a:why.dateOfBirth.age, y:why.dateOfBirth.year});

function mediaOf(d, content){
  if(!content) return [];
  const [a, b] = rangeOf(d), out = [], seen = new Set();
  for(let s = a; s <= b && s < content.slides.length; s++){
    const sl = content.slides[s], txt = sl.paras.map(p => p.t).join(' ');
    for(const mid of sl.media){

      const g = guessCategory(txt);   // words on the slide, corrected by the colours when known (a colour photo is not an X-ray)
      const sel = d.media[mid] || {on:m.ok, cat:m.gray === true ? 'RADIOLOGY' : m.gray === false && g === 'RADIOLOGY' ? 'CLINICAL_PHOTO' : g};
      out.push({mid, m, slide:s, on:m.ok && sel.on, cat:sel.cat});

}

/* ---------- adding a .pptx: read offline, store text + media, detect patients ---------- */
async function addPptx(file){
  const isPptx = /\.pptx$/i.test(file.name || '') || /presentationml/.test(file.type || '');
  if(!isPptx){ toast(t(/\.ppt$/i.test(file.name || '') ? 'oldPpt' : 'notPptx', {n:file.name})); log('warn', 'pptx', 'Not a .pptx: ' + file.name); return; }
  ui.busy = {name:file.name, done:0, total:0}; render();
  const fid = 'f' + uid();
  try{
    const buf = await file.arrayBuffer();
    const r = await parsePptx(buf, (i, n) => { ui.busy = {name:file.name, done:i, total:n}; const el = $('#busyLine'); if(el) el.textContent = t('reading', {n:file.name, i, total:n}); });
    let images = 0, videos = 0, skipped = 0;
    for(const m of Object.values(r.media)){
      if(!m.ok){ skipped++; continue; }
      const bytes = await mediaBytes(r.zip, m);
      await Store.putBytes(mediaPath(fid, m.mid), bytes);
      if(m.kind === 'image'){ images++; const g = await grayImage(bytes, m.mime); if(g != null) m.gray = g; } else videos++;
    }
    for(const m of Object.values(r.media)) delete m.path;
    const content = {slides:r.slides, media:r.media, date:r.date};
    await Store.putText('content/' + fid + '.json', JSON.stringify(content));
    contents.set(fid, content);
    state.files.push(cleanFile({id:fid, name:file.name, size:file.size, addedAt:Date.now(), slides:r.slides.length, images, videos, skipped}));
    save();
    toast(t('fileRead', {n:file.name, s:r.slides.length}));
  }catch(err){
    const code = String(err && err.message);
    const msg = code === 'not-zip' || code === 'bad-zip' ? t('errZip') : code === 'no-slides' ? t('errNoSlides') : code === 'zip64' ? t('errZip64') : t('errRead');
    log('error', 'pptx', file.name + ' — ' + msg, err && (err.stack || err.message));
    alert(file.name + '\n' + msg);
    for(const p of await Store.list('media/' + fid + '/')) await Store.del(p);
  }finally{ ui.busy = null; render(); }
}
async function deleteFile(f){
  state.drafts = state.drafts.filter(d => d.fileId !== f.id);
  state.files = state.files.filter(x => x !== f);

  await Store.del('content/' + f.id + '.json');

/* ---------- highlighting: assign the selected lines to a field ----------
   ui.sel = {fid, items:[{s,p,a,b}], target:undefined | 'cur' | 'new'} */
function selTarget(sel){
  const s0 = Math.min(...sel.items.map(x => x.s)), d = draftAt(sel.fid, s0);
  return {s0, d, isNew:sel.target === 'new' || !d};
}
function selText(sel){
  const c = contents.get(sel.fid);
  return sel.items.map(x => c.slides[x.s].paras[x.p].t.slice(x.a, x.b)).join(' / ');
}
function assignSelection(field){
  const sel = ui.sel; if(!sel || !sel.items.length) return;
  const f = fileById(sel.fid), content = contents.get(sel.fid); if(!f || !content) return;
  const kind = FIELD[field].kind;
  const items = sel.items.slice().sort((x, y) => x.s - y.s || x.p - y.p || x.a - y.a);
  const raws = items.map(x => content.slides[x.s].paras[x.p].t.slice(x.a, x.b));
  const vals = raws.map((r, i) => items[i].a === 0 ? stripLabelFor(r, field) : r.trim());
  if(!vals.some(Boolean)){ toast(t('emptySel')); return; }
  let use = items;
  if(kind === 'date' || kind === 'side'){              // one value: the first line that gives a valid date / side
    const k = vals.findIndex(v => kind === 'date' ? normDate(v) || (field === 'dateOfBirth' && ageIn(v) != null) : normSide(v));
    if(k < 0){ toast(t(kind === 'date' ? 'badDate' : 'badSide', {v:vals.join(' ').slice(0, 40)})); return; }
    use = [items[k]];
  }
  let {s0, d, isNew} = selTarget(sel);
  if(d && locked(d) && !isNew){ toast(t('lockedDraft')); return; }
  const snap = snapshot(f.id);
  // Picking a name on a later slide of a patient who already has one starts the next patient, unless « this patient » was chosen.
  let auto = false;
  if(!isNew && sel.target === undefined && field === 'fullName' && d && d.start !== s0 && (valuesOf(d, content, true).fullName || '').trim()) { isNew = true; auto = true; }
  if(isNew){
    const nd = newDraft(f.id, s0, 'manual');
    if(d && d.end != null && d.end >= s0){ nd.end = d.end; d.end = null; }
    if(d) refreshName(d, content);
    d = nd;
  }
  const [a, b] = rangeOf(d);
  // Same field or exactly the same text: replaced. A word inside a line of another field: both kept (« poignet » in an imaging line).
  for(const x of use) f.marks = f.marks.filter(m => !(m.s === x.s && m.p === x.p && m.a < x.b && x.a < m.b && (m.f === field || (m.a === x.a && m.b === x.b))));
  if(kind !== 'long') f.marks = f.marks.filter(m => !(m.f === field && m.s >= a && m.s <= b));
  const g = use.length > 1 ? uid().slice(-8) : null;
  for(const x of use) f.marks.push(g ? {s:x.s, p:x.p, a:x.a, b:x.b, f:field, g} : {s:x.s, p:x.p, a:x.a, b:x.b, f:field});

  refreshName(d, content);
  ui.sel = null; try{ window.getSelection().removeAllRanges(); }catch(e){}
  save();
  const k = draftsOf(f.id).indexOf(d) + 1;
  const w = field === 'dateOfBirth' ? valuesInfo(d, content).why.dateOfBirth : null;
  const approx = w ? ' · ' + t('approxShort', {a:w.age, y:w.year - w.age}) : '';
  snack((isNew ? t(auto ? 'newPatientFrom' : 'newPatientN', {n:s0 + 1, k}) + ' · ' + t('addedTo', {f:fieldLabel(field)}) : t('assignedTo', {f:fieldLabel(field), p:t('patientN', {n:k})})) + approx, snap, s0);
}
function removeMark(f, m){

/* ---------- duplicates ---------- */
function nameTokens(s){ return norm(s).replace(/^(m|mr|mme|mlle|monsieur|madame)\.?\s+/, '').split(/[^a-z0-9]+/).filter(w => w.length > 1); }
function sameName(a, b){
  const A = nameTokens(a), B = nameTokens(b); if(!A.length || !B.length) return false;
  const [s, l] = A.length <= B.length ? [A, B] : [B, A];
  return s.length >= Math.min(2, l.length) && s.every(w => l.includes(w));
}
function dayOf(v){ if(v == null || v === '') return ''; if(typeof v === 'string') return normDate(v) || v; const d = new Date(Number(v)); return isNaN(d) ? '' : isoDay(d); }
async function findMatches(d, content){
  const v = valuesOf(d, content, true), name = (v.fullName || '').trim();
  if(!name || !patientsApi()) return [];
  const seen = new Map();
  const queries = [name, ...nameTokens(name).filter(w => w.length >= 3).sort((x, y) => y.length - x.length).slice(0, 2)];
  for(const q of queries){
    let hits = [];
    try{ hits = await HOST.patients.search(q, {limit:20}); }catch(e){ log('error', 'match', 'search — ' + (e && e.message)); break; }
    for(const h of hits || []) if(!seen.has(h.id) && !h.isArchived && sameName(name, h.fullName)) seen.set(h.id, h);
  }
  const dob = valuesInfo(d, content).why.dateOfBirth ? '' : (v.dateOfBirth || '');   // an approximate date proves nothing
  return [...seen.values()].map(h => ({id:h.id, code:h.patientCode, name:h.fullName, dob:dayOf(h.dateOfBirth), diag:h.diagnosis || '',
    sameDob:!!dob && dayOf(h.dateOfBirth) === dob, otherDob:!!dob && !!dayOf(h.dateOfBirth) && dayOf(h.dateOfBirth) !== dob}))
    .sort((a, b) => (b.sameDob - a.sameDob) || (a.otherDob - b.otherDob));
}

/* ---------- import (nothing is written before the user confirms) ---------- */
function importNote(f, d){

}
async function nextCodeNumber(){
  let n = state.lastCode;
  try{ for(const h of await HOST.patients.search('PPTX-', {limit:200}) || []){ const m = /^PPTX-(\d+)$/i.exec(h.patientCode || ''); if(m) n = Math.max(n, +m[1]); } }
  catch(e){ log('warn', 'import', 'search PPTX- — ' + (e && e.message)); }
  for(const r of state.registry){ const m = /^PPTX-(\d+)$/i.exec(r.code); if(m) n = Math.max(n, +m[1]); }
  return n + 1;
}
const pptxCode = n => 'PPTX-' + String(n).padStart(4, '0');
async function createWithCode(fields){

    try{ const r = await HOST.patients.create(Object.assign({}, fields, {patientCode:pptxCode(n)})); state.lastCode = n; return r; }
    catch(e){ if(/already used/i.test(e && e.message)){ log('info', 'import', `${pptxCode(n)} already used (maybe archived): next number`); continue; } throw e; }

function toApi(k, v){ return FIELD[k].kind === 'date' ? (normDate(v) || null) : FIELD[k].kind === 'side' ? (normSide(v) || v) : String(v).slice(0, FIELD[k].max); }
/* What an existing record holds for a field ('' when empty; the app's default side means « not filled »). */
function existingValue(ex, k){
  if(!ex || ex[k] == null) return '';

  if(k === 'side' && ex[k] === 'NOT_APPLICABLE') return '';
  return String(ex[k]);

/* Update: only fields found, never blank out; generalNotes appended. */
function updateFields(vals, ex, note){
  const out = {};
  for(const [k, v] of Object.entries(vals)){
    if(k === 'generalNotes') continue;
    const cur = existingValue(ex, k);
    const nv = toApi(k, v); if(nv == null || nv === '') continue;
    if(String(cur) === String(nv)) continue;
    out[k] = nv;
  }
  const extra = [vals.generalNotes, note].filter(Boolean).join('\n');
  out.generalNotes = (ex.generalNotes ? ex.generalNotes + '\n\n' : '') + extra;
  if(out.generalNotes.length > FIELD.generalNotes.max) out.generalNotes = out.generalNotes.slice(0, FIELD.generalNotes.max);
  return out;
}
async function importDrafts(list, onStep){

    const f = fileById(d.fileId), content = await ensureContent(d.fileId);
    const label = d.name || t('noName');
    if(onStep) onStep(i + 1, list.length, label);
    if(d.match.mode === 'skip' && !(d.result && d.result.id)){ d.status = 'skipped'; rep.skipped.push(label); save(); continue; }
    try{
      if(!content) throw new Error(t('errContent'));
      const vals = valuesOf(d, content), note = importNote(f, d);
      if(!(d.result && d.result.id)){
        if(!vals.fullName || !vals.fullName.trim()) throw new Error('fullName is required');
        let res, action;
        if(d.match.mode === 'update' && d.match.id){
          const ex = await HOST.patients.get(d.match.id);
          if(!ex) throw new Error(`Unknown patient '${d.match.id}'`);
          res = await HOST.patients.update(ex.id, updateFields(vals, ex, note)); action = 'updated';
        } else {
          const fields = {};
          for(const [k, v] of Object.entries(vals)){ const x = toApi(k, v); if(x != null && x !== '') fields[k] = x; }
          fields.generalNotes = [fields.generalNotes, note].filter(Boolean).join('\n\n').slice(0, FIELD.generalNotes.max);
          res = await createWithCode(fields); action = 'created';
        }
        d.result = {id:res.id, code:res.patientCode, action, done:[], errors:[]};
        const [a, b] = rangeOf(d);
        state.registry.push({pid:res.id, code:res.patientCode, name:vals.fullName, file:f.name, slides:a === b ? String(a + 1) : `${a + 1}–${b + 1}`, date:Date.now(), action, media:0});
        flush();                                                         // saved before anything else: a crash never creates it twice
      }
      d.result.errors = [];
      const reg = state.registry.slice().reverse().find(r => r.pid === d.result.id);
      for(const x of mediaOf(d, content).filter(x => x.on && !d.result.done.includes(x.mid))){
        try{
          const bytes = await Store.getBytes(mediaPath(d.fileId, x.mid));
          if(!bytes) throw new Error(t('errMediaGone'));
          await HOST.patients.addMedia(d.result.id, {data:bytes, mimeType:x.m.mime, category:x.cat, notes:t('mediaNote', {s:x.slide + 1, f:f.name})});
          d.result.done.push(x.mid); rep.media++; if(reg) reg.media++; flush();
        }catch(e){
          const msg = String(e && e.message || e);
          d.result.errors.push({mid:x.mid, msg}); rep.mediaErrors.push(`${label} — ${x.m.name} : ${msg}`);
          log('error', 'import', `${label} — ${x.m.name}: ${msg}`);
        }
      }
      d.status = d.result.errors.length ? 'partial' : 'imported'; d.error = '';
      (d.result.action === 'updated' ? rep.updated : rep.created).push(`${d.result.code} — ${label}`);
    }catch(e){
      const msg = String(e && e.message || e);
      d.status = 'error'; d.error = msg; rep.errors.push(`${label} : ${msg}`);
      log('error', 'import', `${label}: ${msg}`);
    }
    flush();
  }
  ui.importing = false;
  return rep;
}

/* ---------- Gemini (optional): pre-fill a whole file, one file at a time ---------- */
function aiSchema(){
  const props = {};

    props[k] = kind === 'side' ? {type:'STRING', enum:SIDES, nullable:true} : kind === 'date' ? {type:'STRING', nullable:true, description:'YYYY-MM-DD'} : {type:'STRING'};
  }
  return {type:'OBJECT', properties:{patients:{type:'ARRAY', items:{type:'OBJECT', properties:{
    firstSlide:{type:'INTEGER'}, lastSlide:{type:'INTEGER'}, continuesPrevious:{type:'BOOLEAN'}, fields:{type:'OBJECT', properties:props},
    images:{type:'ARRAY', items:{type:'OBJECT', properties:{index:{type:'INTEGER'}, category:{type:'STRING', enum:CATEGORIES}}, required:['index', 'category']}}},
    required:['firstSlide', 'lastSlide', 'fields']}}}, required:['patients']};
}
/* ---------- what Gemini costs: estimate before sending, real count after ---------- */
const IMG_PER_PART = 10;
const IMG_TOKENS = [260, 1100];              // per reduced image, depending on the model
function estimateAi(content, images){
  const parts = aiParts(content.slides.length);
  let chars = 0, nimg = 0;
  parts.forEach((r, k) => { const {prompt, imgs} = partPrompt(content, r, k, parts.length, null); chars += prompt.length + 1800;   // + the answer format sent with each request
    nimg += Math.min(IMG_PER_PART, imgs.filter(x => x.slide >= r[0] && x.slide <= r[1]).length); });
  const text = Math.round(chars / 3.6), out = Math.round(content.slides.length * 60 + 400);
  return {parts:parts.length, text, out, images:images ? nimg : 0, imgLow:images ? nimg * IMG_TOKENS[0] : 0, imgHigh:images ? nimg * IMG_TOKENS[1] : 0, available:nimg};

/* Called by the Gemini code for every answer received (failed requests that Google does not bill have no usage). */
function onUsage(model, u){

  const f = AIQ.file; if(f){ f.ai.usage = f.ai.usage || {in:0, out:0, total:0, requests:0, since:Date.now()}; add(f.ai.usage); }

/* Long decks are read in parts: each answer stays short and precise, and a failure only costs one part. */
const PART = 15;

function deckImages(content){
  const imgs = [];

/* The text sent for one part: slide text with image placeholders (#n), no pictures. Shared with the estimate. */

    return `--- Slide ${i + 1}${sl.hidden ? ' (hidden)' : ''} ---\n` + (sl.paras.filter(p => !NOISE_RE.test(p.t.trim())).map(p => (p.notes ? '[speaker notes] ' : '') + p.t).join('\n') || '(no text)') +

This kind of presentation (for example an on-call "garde" report or a staff meeting) usually holds MANY patients, often one to five slides each, each one starting with a number and/or the patient's name. Return EVERY patient separately: a new name or a new case number always means a new patient; never merge different people. Slides with only images, "Date/Time" or no text belong to the patient before them.
${prev ? `The previous part ended with the patient "${prev.fields.fullName || 'without a name'}" (slides ${prev.start + 1}–${prev.end + 1}). If the first slides of this part still belong to that patient (no new name or case number yet), return them as one patient with "continuesPrevious": true.\n` : ''}For each patient give firstSlide and lastSlide (slide numbers as below) and the fields found. Copy values from the slides; never invent. Leave a field empty when it is not in the slides.

${text}`;

}
async function aiRequestPart(f, content, [a, b], k, total, prev){

    for(const x of imgs.filter(x => x.slide >= a && x.slide <= b).slice(0, IMG_PER_PART)){
      const bytes = await Store.getBytes(mediaPath(f.id, x.mid)); if(!bytes) continue;
      const url = await aiImage(bytes, content.media[x.mid].mime); if(!url) continue;
      parts.push({text:`Image #${imgs.indexOf(x) + 1} (slide ${x.slide + 1}):`}, imagePart(url));

    if(!p || typeof p !== 'object') continue;

    if(s0 == null) continue; if(s1 == null || s1 < s0) s1 = s0;
    s0 = Math.min(Math.max(s0 - 1, a), b); s1 = Math.min(Math.max(s1 - 1, s0), b);   // stay inside this part

      if(!FIELD[key] || v == null) continue;

/* Adds one part's patients; a patient continuing across the border is joined to the previous one. */
function mergePart(acc, list, partStart){
  for(const p of list){
    const last = acc[acc.length - 1];
    // Only at the border between two parts, and only for the same person: never merges two patients.
    const joins = last && p.start === partStart && (p.cont || !p.fields.fullName ||
      (last.fields.fullName && norm(p.fields.fullName) === norm(last.fields.fullName)));
    if(!joins){ acc.push({start:p.start, end:p.end, fields:p.fields, media:p.media}); continue; }
    last.end = Math.max(last.end, p.end);
    for(const [k, v] of Object.entries(p.fields)){
      if(!last.fields[k]) last.fields[k] = v;
      else if(FIELD[k].kind === 'long' && !last.fields[k].includes(v)) last.fields[k] = (last.fields[k] + '\n' + v).slice(0, FIELD[k].max);

function applyAi(f, r){
  const keep = draftsOf(f.id).filter(locked), ranges = keep.map(rangeOf);

  state.drafts = state.drafts.filter(d => d.fileId !== f.id || locked(d));
  f.marks = f.marks.filter(m => inKept(m.s));
  const used = new Set();
  for(const p of r.patients.sort((x, y) => x.start - y.start)){
    if(inKept(p.start) || used.has(p.start)) continue; used.add(p.start);
    const d = newDraft(f.id, p.start, 'ai'); d.end = p.end; d.edits = p.fields; d.media = p.media; d.name = p.fields.fullName || '';

const AIQ = {timer:0, running:false, file:null};

    keep ? {progress:keep, usage:f.ai.usage} : {});
  state.aiPaused = false; save(); render(); aiPump();
}
async function aiPump(){
  if(AIQ.running || loadFailed) return;
  clearTimeout(AIQ.timer);
  if(state.aiPaused || !aiAvailable()) return;
  const now = Date.now();
  const f = state.files.find(x => x.ai.status === 'queued') || state.files.filter(x => x.ai.status === 'waiting' && x.ai.nextAt <= now).sort((a, b) => a.ai.nextAt - b.ai.nextAt)[0];
  if(!f){
    const next = state.files.filter(x => x.ai.status === 'waiting').map(x => x.ai.nextAt);
    if(next.length) AIQ.timer = setTimeout(aiPump, Math.max(500, Math.min(...next) - now));
    return;
  }
  AIQ.running = true; AIQ.file = f; f.ai.status = 'running'; f.ai.attempts++; f.ai.error = ''; save(); render();
  try{
    const content = await ensureContent(f.id);
    if(!content) throw AppError('parse', 'Slide text missing');
    const partsList = aiParts(content.slides.length);
    const pr = f.ai.progress && f.ai.progress.total === partsList.length ? f.ai.progress : {next:0, total:partsList.length, patients:[], model:''};
    f.ai.progress = pr;
    for(let k = pr.next; k < pr.total; k++){
      render();
      const r = await aiRequestPart(f, content, partsList[k], k, pr.total, pr.patients[pr.patients.length - 1] || null);

    }

    toast(t('aiDone', {n:f.name, p:n}));
  }catch(e){
    logAppError('ai', e);
    const msg = userMessage(e);
    if(['noKey', 'badKey', 'denied', 'noInternetPerm'].includes(e.code)){ f.ai.status = 'queued'; f.ai.attempts--; f.ai.error = msg; state.aiPaused = true; }
    else if(RETRYABLE.includes(e.code) && f.ai.attempts < 8){ f.ai.status = 'waiting'; f.ai.nextAt = Date.now() + Math.min(15 * 60e3, 30e3 * 2 ** (f.ai.attempts - 1)); f.ai.error = msg; }
    else { f.ai.status = 'failed'; f.ai.error = msg; }
  }

}

/* =====================================================================
   Gemini — always the newest available model, with fallback and logging
   ===================================================================== */
function apiKey(){ return (storeGet(KEY_API) || '').trim(); }
/* The app's Gemini key (bridge v6, permission `gemini`): the key never reaches this page.

const APP_GEMINI = (HOST && HOST.gemini && HOST.permissions && HOST.permissions.has('gemini')) ? HOST.gemini : null;
const APP_AVOID_LITE = true;
let appGemini = null;   // { configured, model } once read from the app
async function readAppGemini(){
  if(!APP_GEMINI) return null;
  try{ appGemini = await APP_GEMINI.status(); }catch(e){ appGemini = null; }
  return appGemini;
}
function appKeyMode(){ return !!APP_GEMINI && state.settings.keyMode !== 'own'; }
function useAppKey(){ return appKeyMode() && !!(appGemini && appGemini.configured); }

function aiAvailable(){ return useAppKey() || !!apiKey(); }
/** The model asked of the app: this extension's own choice, else the app's. */
function appModelChoice(){
  const s = state.settings;
  if(s.model === 'custom' && s.customModel) return s.customModel;
  const alias = {flash:'gemini-flash-latest', pro:'gemini-pro-latest', lite:'gemini-flash-lite-latest'}[s.model];
  if(alias) return alias;

/** generateContent through the app: same input and output as fetch, errors in this extension's codes. */
async function appGenerate(url, opts, ms){
  const m = /\/models\/([^:/]+):generateContent/.exec(url);
  let body = {};
  try{ body = JSON.parse((opts && opts.body) || '{}'); }catch(e){}
  let timer = 0;
  try{
    const res = await Promise.race([
      APP_GEMINI.generate({body, model:m ? decodeURIComponent(m[1]) : ''}),
      new Promise((_, reject) => { timer = setTimeout(() => reject(AppError('timeout', 'App Gemini: no answer after ' + Math.round((ms + 30000) / 1000) + ' s')), ms + 30000); })
    ]);
    if(res && res.model && appGemini) appGemini.lastModel = res.model;
    return (res && res.response) || {};
  }catch(e){
    if(e && e.code) throw e;
    const msg = String((e && e.message) || e);
    const status = +((/\((\d{3})\)/.exec(msg) || [])[1] || 0) || undefined;
    const code = {no_key:'noKey', key:'badKey', quota:'quota', server:'server', network:'network', blocked:'blocked', model:'noModel'}[e && e.kind]
      || (e && e.kind === 'format' ? (status ? 'http' : 'parse') : 'server');

}
function AppError(code, detail, status){ const e = new Error(code); e.code = code; e.detail = detail; e.status = status; return e; }
function userMessage(e){

  if(c === 'http') return t('err_http', {s:e.status});

function checkNet(){

async function http(url, opts, ms){

  const timer = ctrl ? setTimeout(() => ctrl.abort(), ms) : 0;
  let res;
  try{ res = await window.fetch(url, Object.assign({}, opts, ctrl ? {signal:ctrl.signal} : {})); }
  catch(e){ throw AppError(e && e.name === 'AbortError' ? 'timeout' : 'network', String(e && e.message || e)); }

function headers(){ return {'Content-Type':'application/json', 'x-goog-api-key':apiKey()}; }

/* Ranks model names: newest version first, stable before preview, preferred family first. */
function parseModel(name){

function cmpVer(a, b){ for(let i = 0; i < Math.max(a.length, b.length); i++){ const d = (b[i] || 0) - (a[i] || 0); if(d) return d; } return 0; }

/* ---------- full-screen photo viewer: pinch / double-tap zoom, pan, rotate, browse, include + category ----------
   list: [{mid, slide}] in order; d: the patient whose import choices are shown (or null); onChange: refresh the caller. */
function openViewer(f, list, index, d, onChange){
  const c = contents.get(f.id);
  let i = Math.max(0, Math.min(index, list.length - 1));
  const V = {s:1, tx:0, ty:0, rot:0, nw:0, nh:0, base:1, W:0, H:0};
  const lock = d && locked(d);
  openSheet(`<div class="vtop"><button class="vbtn" type="button" data-do="close" aria-label="${esc(t('close'))}">✕</button>
      <div class="grow" style="min-width:0"><b class="ellipsis small" data-slot="vname" style="display:block"></b><span class="tiny vmuted" data-slot="vpos"></span></div>
      <button class="vbtn" type="button" data-do="rot" aria-label="${esc(t('rotate'))}">↻</button></div>
    <div class="vstage" data-slot="stage"><img class="vimg" alt="" draggable="false"><video class="vvid hidden" controls playsinline></video><div class="vmsg hidden"></div></div>
    <div class="vbar"><button class="vbtn" type="button" data-do="prev" aria-label="${esc(t('prevImage'))}">‹</button>
      <button class="vbtn" type="button" data-do="out" aria-label="${esc(t('zoomOut'))}">－</button>
      <button class="vbtn wide" type="button" data-do="fit" data-slot="zoom">100 %</button>
      <button class="vbtn" type="button" data-do="in" aria-label="${esc(t('zoomIn'))}">＋</button>
      <button class="vbtn" type="button" data-do="next" aria-label="${esc(t('nextImage'))}">›</button></div>
    <div class="vctl" data-slot="ctl"></div>`, sheet => {
    sheet.classList.add('full', 'viewer-sheet');
    const slot = n => sheet.querySelector(`[data-slot="${n}"]`), stage = slot('stage'), img = sheet.querySelector('.vimg'), vid = sheet.querySelector('.vvid'), msg = sheet.querySelector('.vmsg');
    const cur = () => list[i], media = () => c.media[cur().mid];
    const choice = () => { const x = d ? mediaOf(d, c).find(y => y.mid === cur().mid) : null; return x ? {on:x.on, cat:x.cat} : null; };
    function measure(){
      const r = stage.getBoundingClientRect(); V.W = r.width || 360; V.H = r.height || 480;
      V.nw = img.naturalWidth || V.W; V.nh = img.naturalHeight || V.H;
      const odd = V.rot % 180 !== 0, ew = odd ? V.nh : V.nw, eh = odd ? V.nw : V.nh;
      V.base = Math.min(V.W / ew, V.H / eh);
      img.style.width = (V.nw * V.base) + 'px'; img.style.height = (V.nh * V.base) + 'px';
    }
    function clamp(){
      V.s = Math.max(1, Math.min(6, V.s));
      const odd = V.rot % 180 !== 0, dw = (odd ? V.nh : V.nw) * V.base * V.s, dh = (odd ? V.nw : V.nh) * V.base * V.s;
      const mx = Math.max(0, (dw - V.W) / 2), my = Math.max(0, (dh - V.H) / 2);
      V.tx = Math.max(-mx, Math.min(mx, V.tx)); V.ty = Math.max(-my, Math.min(my, V.ty));
    }
    function apply(){
      clamp();
      img.style.transform = `translate(-50%, -50%) translate(${V.tx.toFixed(1)}px, ${V.ty.toFixed(1)}px) scale(${+V.s.toFixed(3)}) rotate(${V.rot}deg)`;
      slot('zoom').textContent = Math.round(V.s * 100) + ' %';
      stage.classList.toggle('zoomed', V.s > 1.01);
    }
    /* Zoom keeping the point (px, py), relative to the stage centre, under the finger. */
    function zoomAt(s2, px, py){ s2 = Math.max(1, Math.min(6, s2)); V.tx = px - (px - V.tx) * s2 / V.s; V.ty = py - (py - V.ty) * s2 / V.s; V.s = s2; apply(); }
    function ctl(){
      if(!d){ slot('ctl').innerHTML = `<p class="tiny vmuted">${esc(t('mediaNoDraft'))}</p>`; return; }
      const ch = choice(), k = draftsOf(d.fileId).indexOf(d) + 1;
      slot('ctl').innerHTML = !media().ok ? `<p class="small">🚫 ${esc(whyText(media()))}</p>` : lock ? `<p class="tiny vmuted">${esc(t('lockedDraft'))}</p>` :
        `<label class="vcheck"><input type="checkbox" data-do="on" ${ch && ch.on ? 'checked' : ''}><span>${esc(t('includeMedia', {n:t('patientN', {n:k}) + (d.name ? ' — ' + d.name : '')}))}</span></label>
         <div class="vchips">${CATEGORIES.map(x => `<button type="button" class="vchip${ch && ch.cat === x ? ' on' : ''}" data-c="${x}">${esc(t('cat_' + x))}</button>`).join('')}</div>`;
    }
    async function show(){
      const m = media(), it = cur();
      V.s = 1; V.tx = 0; V.ty = 0; V.rot = 0;
      slot('vname').textContent = m.name;
      slot('vpos').textContent = t('slideN', {n:it.slide + 1}) + (list.length > 1 ? ` · ${i + 1}/${list.length}` : '');
      sheet.querySelector('[data-do="prev"]').disabled = i === 0; sheet.querySelector('[data-do="next"]').disabled = i === list.length - 1;
      img.classList.add('hidden'); vid.classList.add('hidden'); msg.classList.add('hidden');
      img.removeAttribute('src'); vid.removeAttribute('src');
      ctl();
      const url = m.ok && !f.mediaLost ? await blobUrl(f.id, it.mid, m.mime) : null;
      if(!sheet.isConnected || cur() !== it) return;
      if(url && m.kind === 'video'){ vid.src = url; vid.classList.remove('hidden'); return; }
      if(url && THUMBABLE.includes(m.mime)){

        img.src = url; img.classList.remove('hidden'); measure(); apply(); return;
      }
      msg.textContent = !m.ok ? whyText(m) : f.mediaLost ? t('mediaLost') : t('noPreview');
      msg.classList.remove('hidden');

    function go(step){ const j = i + step; if(j < 0 || j >= list.length) return; i = j; show(); }
    // ---- gestures (pointer events: pinch with two fingers, pan when zoomed, swipe to browse, double tap)
    const pts = new Map(); let g = null, lastTap = {t:0, x:0, y:0};
    const rel = e => { const r = stage.getBoundingClientRect(); return {x:e.clientX - r.left - (r.width || V.W) / 2, y:e.clientY - r.top - (r.height || V.H) / 2}; };

    stage.addEventListener('pointerdown', e => {
      if(img.classList.contains('hidden')) return;

      const p = [...pts.values()];
      if(p.length === 2) g = {pinch:true, d0:Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, s0:V.s, tx0:V.tx, ty0:V.ty, m0:{x:(p[0].x + p[1].x) / 2, y:(p[0].y + p[1].y) / 2}};
      else if(p.length === 1) g = {pinch:false, x0:p[0].x, y0:p[0].y, tx0:V.tx, ty0:V.ty, moved:false, t0:Date.now()};
      e.preventDefault();
    });
    stage.addEventListener('pointermove', e => {
      if(!pts.has(pid(e)) || !g) return;
      pts.set(pid(e), rel(e)); const p = [...pts.values()];
      if(g.pinch && p.length >= 2){
        const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), m = {x:(p[0].x + p[1].x) / 2, y:(p[0].y + p[1].y) / 2};
        const s2 = Math.max(1, Math.min(6, g.s0 * dist / g.d0));
        V.tx = m.x - (g.m0.x - g.tx0) * s2 / g.s0; V.ty = m.y - (g.m0.y - g.ty0) * s2 / g.s0; V.s = s2; apply();
      } else if(!g.pinch){
        const dx = p[0].x - g.x0, dy = p[0].y - g.y0;
        if(Math.hypot(dx, dy) > 8) g.moved = true;
        if(V.s > 1.01){ V.tx = g.tx0 + dx; V.ty = g.ty0 + dy; apply(); }
      }
      e.preventDefault();
    });
    const up = e => {
      if(!pts.has(pid(e))) return;
      const p = pts.get(pid(e)); pts.delete(pid(e));
      if(g && g.pinch){ if(pts.size === 1){ const q = [...pts.values()][0]; g = {pinch:false, x0:q.x, y0:q.y, tx0:V.tx, ty0:V.ty, moved:true, t0:Date.now()}; } else if(!pts.size) g = null; return; }
      if(!g) return;
      const dx = p.x - g.x0, dy = p.y - g.y0;
      if(V.s <= 1.01 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){ go(dx < 0 ? 1 : -1); g = null; return; }   // swipe
      if(!g.moved && Date.now() - g.t0 < 350){
        const now = Date.now();
        if(now - lastTap.t < 320 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 30){
          if(V.s > 1.01){ V.s = 1; V.tx = 0; V.ty = 0; apply(); } else zoomAt(2.5, p.x, p.y);
          lastTap = {t:0, x:0, y:0};
        } else lastTap = {t:now, x:p.x, y:p.y};
      }
      g = null;
    };
    stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
    stage.addEventListener('wheel', e => { if(img.classList.contains('hidden')) return; const p = rel(e); zoomAt(V.s * (e.deltaY < 0 ? 1.25 : 0.8), p.x, p.y); e.preventDefault(); }, {passive:false});
    window.addEventListener('resize', () => { if(sheet.isConnected && !img.classList.contains('hidden')){ measure(); apply(); } });
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-do],[data-c]'); if(!b) return;

      else if(x === 'fit'){ V.s = 1; V.tx = 0; V.ty = 0; apply(); }
      else if(x === 'rot'){ V.rot = (V.rot + 90) % 360; V.s = 1; V.tx = 0; V.ty = 0; measure(); apply(); }

        const ch = choice(); d.media[cur().mid] = {on:ch ? ch.on : true, cat:b.dataset.c};

      }
    });
    sheet.addEventListener('change', e => {
      if(e.target.dataset.do !== 'on' || !d || lock) return;
      const ch = choice(); d.media[cur().mid] = {on:e.target.checked, cat:ch ? ch.cat : 'OTHER'};
      if(d.status === 'ready') d.status = 'draft';
      save(); if(onChange) onChange();
    });
    show();
  });
}

async function saveText(name, text, mime){
  if(HOST) return HOST.saveFile(name, text, mime);
  const url = URL.createObjectURL(new Blob([text], {type:mime}));
  const a = Object.assign(document.createElement('a'), {href:url, download:name});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
function checkExportPerm(ctx){
  if(HOST && !HOST.permissions.has('import_export')){ log('error', ctx, 'import_export not granted'); toast('⚠️ ' + t('noPickPerm')); return false; }
  return true;
}

async function exportBackup(){
  if(HOST && !HOST.permissions.has('import_export')){ toast('⚠️ ' + t('noPickPerm')); return; }
  flush();
  const cs = {};
  for(const f of state.files){ const c = await ensureContent(f.id); if(c) cs[f.id] = c; }
  const ok = await saveText(`${ID}-${today()}.json`, JSON.stringify({app:ID, v:SCHEMA, date:new Date().toISOString(), data:state, contents:cs}), 'application/json');
  if(ok) toast(t('backupSaved'));
}
async function restoreBackup(file){
  try{
    const raw = JSON.parse(await file.text());
    if(!raw || raw.app !== ID || !raw.data || !Array.isArray(raw.data.files) || !Array.isArray(raw.data.drafts)) throw new Error('format');
    if(!confirm(t('confirmRestore'))) return;
    const next = migrate(raw.data), cs = raw.contents && typeof raw.contents === 'object' ? raw.contents : {};
    for(const f of next.files){
      const c = cs[f.id];
      if(c && Array.isArray(c.slides)){ await Store.putText('content/' + f.id + '.json', JSON.stringify(c)); contents.set(f.id, c); }
      const have = await Store.list('media/' + f.id + '/');
      f.mediaLost = f.images + f.videos > 0 && have.length === 0;
    }
    next.gemini = state.gemini;
    state = next; loadFailed = false; flush(); ui.view = null; ui.tab = 'files'; ui.picked.clear(); render(); toast(t('restored'));
  }catch(err){ log('error', 'backup', 'Restore refused', String(err && err.message)); alert(t('badBackup')); }
}
async function exportCsv(){
  if(HOST && !HOST.permissions.has('import_export')){ toast('⚠️ ' + t('noPickPerm')); return; }
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['code', 'name', 'action', 'file', 'slides', 'date', 'media', 'id'].join(';'),
    ...state.registry.map(r => [r.code, r.name, r.action, r.file, r.slides, isoDay(new Date(r.date)), r.media, r.pid].map(q).join(';'))];
  if(await saveText(`${ID}-importes-${today()}.csv`, '\ufeff' + rows.join('\r\n'), 'text/csv')) toast(t('backupSaved'));
}

async function relinkMedia(f, file){
  ui.busy = {name:file.name, done:0, total:0}; render();
  try{
    const r = await parsePptx(await file.arrayBuffer());
    if(r.slides.length !== f.slides) throw new Error('different presentation');
    for(const m of Object.values(r.media)) if(m.ok) await Store.putBytes(mediaPath(f.id, m.mid), await mediaBytes(r.zip, m));
    f.mediaLost = false; save(); toast(t('mediaRelinked'));

}

/* Text selected with the finger → offsets in the paragraph (field tags excluded). */
function offsetIn(node, off){
  const start = node.nodeType === 1 ? node : node.parentNode, ln = start && start.closest && start.closest('.ln');
  if(!ln){ const para = start && start.closest && start.closest('.para'); return para ? null : null; }
  const r = document.createRange(); r.selectNodeContents(ln); r.setEnd(node, off);
  const frag = r.cloneContents(); frag.querySelectorAll('.mt,.nt').forEach(x => x.remove());
  return +ln.dataset.a + frag.textContent.replace(/\u00a0/g, '').length;
}
document.addEventListener('selectionchange', () => {
  if(!ui.view || ui.view.type !== 'file') return;
  const s = window.getSelection && window.getSelection();
  if(!s || s.isCollapsed || !s.rangeCount){ if(ui.sel && ui.sel.fromSel){ ui.sel = null; renderBar(); } return; }
  const r = s.getRangeAt(0), st = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode;
  const pEl = st && st.closest && st.closest('.para'); if(!pEl) return;
  const c = contents.get(ui.view.id); if(!c) return;
  const sIdx = +pEl.dataset.s, pIdx = +pEl.dataset.p, txt = c.slides[sIdx].paras[pIdx].t;
  let a = offsetIn(r.startContainer, r.startOffset), b = pEl.contains(r.endContainer) ? offsetIn(r.endContainer, r.endOffset) : txt.length;
  if(a == null) a = 0; if(b == null) b = txt.length;
  while(a < b && /\s/.test(txt[a])) a++; while(b > a && /\s/.test(txt[b - 1])) b--;
  if(b <= a) return;
  ui.sel = {fid:ui.view.id, items:[{s:sIdx, p:pIdx, a, b}], fromSel:true, target:ui.sel ? ui.sel.target : undefined};
  updatePicked(); renderBar();
});
/* Tapping lines: several lines of the same patient can be picked before choosing the field. */
function toggleLine(item){
  const f = fileById(ui.view.id), sel = ui.sel;
  const same = x => x.s === item.s && x.p === item.p && x.a === item.a && x.b === item.b;
  const sameGroup = sel && !sel.fromSel && sel.fid === f.id && sel.items.length && (() => {
    const d1 = draftAt(f.id, sel.items[0].s), d2 = draftAt(f.id, item.s);
    return d1 ? d1 === d2 : !d2 && sel.items[0].s === item.s; })();
  if(sameGroup){
    if(sel.items.some(same)) sel.items = sel.items.filter(x => !same(x)); else sel.items.push(item);
    if(!sel.items.length) ui.sel = null;
  } else ui.sel = {fid:f.id, items:[item]};
  try{ window.getSelection().removeAllRanges(); }catch(e){}
  updatePicked(); renderBar();
}

      if(!m || !m.ok){ await openMediaSheet(wf, mid, s); break; }
      const d = draftAt(wf.id, s);
      const list = d ? mediaOf(d, c).filter(x => x.m.ok).map(x => ({mid:x.mid, slide:x.slide})) : c.slides[s].media.filter(id => c.media[id].ok).map(id => ({mid:id, slide:s}));
      openViewer(wf, list, Math.max(0, list.findIndex(x => x.mid === mid)), d, () => rerenderKeep(s));
      break;
    }
    case 'review': { const d = draftById(id); if(d) await openReview(d); break; }
    case 'filter': ui.filter = el.dataset.k; render(); break;
    case 'pick': { if(el.checked) ui.picked.add(id); else ui.picked.delete(id); render(); break; }
    case 'pickReady': state.drafts.filter(d => d.status === 'ready' || d.status === 'partial').forEach(d => ui.picked.add(d.id)); render(); break;
    case 'importSel': await openConfirm(); break;
    case 'exportCsv': await exportCsv(); break;
    case 'toggleKey': { const inp = $('#apikey'); const val = inp ? inp.value : ''; ui.showKey = !ui.showKey; render(); $('#apikey').value = val; break; }
    case 'saveKey': {
      const k = ($('#apikey').value || '').trim();
      if(k.length < 20 || /\s/.test(k)){ ui.keyMsg = `<div class="aibox err">${esc(t('keyInvalidFormat'))}</div>`; log('warn', 'models', 'Key rejected before saving (format)'); render(); break; }
      try{ storeSet(KEY_API, k); }catch(err){ log('error', 'storage', 'Key not saved', String(err && err.message)); break; }
      state.gemini = {models:[], fetchedAt:0, lastModel:''}; state.aiPaused = false; save(); toast(t('keySaved'));
      if(state.settings.model !== 'custom') await testKey(); else render();
      aiPump(); break;
    }
    case 'testKey': await testKey(); break;
    case 'removeKey': storeDel(KEY_API); state.gemini = {models:[], fetchedAt:0, lastModel:''}; ui.keyMsg = null; save(); render(); toast(t('keyRemoved')); break;
    case 'openLog': ui.view = {type:'log'}; state.seenLog = Date.now(); save(); render(); window.scrollTo(0, 0); break;
    case 'clearLog': if(confirm(t('confirmClearLog'))){ storeDel(KEY_LOG); render(); toast(t('logCleared')); } break;
    case 'exportLog': if(!HOST || HOST.permissions.has('import_export')){ const ok = await saveText(`${ID}-journal-${today()}.txt`, logText(), 'text/plain'); if(ok) toast(t('backupSaved')); } break;
    case 'exportJson': await exportBackup(); break;
    case 'importJson': if(canPick()) $('#pickJson').click(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.input; if(!k) return;
  const s = state.settings;
  if(k === 'model'){ s.model = el.value; state.gemini.lastModel = ''; }
  else if(k === 'customModel') s.customModel = el.value.trim().slice(0, 80);
  else if(k === 'sendImages') s.sendImages = !!el.checked;
  else if(k === 'lang') s.lang = el.value;
  else return;
  save(); if(k !== 'customModel') render();
});
document.addEventListener('input', e => {
  if(e.target.id !== 'regq') return;
  ui.q = e.target.value;
  const box = document.getElementById('reglist'); if(!box){ render(); return; }
  const pos = e.target.selectionStart; render(); const inp = document.getElementById('regq'); if(inp){ inp.focus(); try{ inp.setSelectionRange(pos, pos); }catch(x){} }
});
document.getElementById('view').addEventListener('focusin', e => {
  const f = e.target; if(!f.matches || !f.matches('input,textarea')) return;
  setTimeout(() => { fitViewport(); f.scrollIntoView({block:'center', behavior:'smooth'}); }, 320);
});

/* ---------- theme, Back, start ---------- */
function applyTheme(th){ document.documentElement.dataset.theme = th === 'dark' ? 'dark' : 'light'; }
if(HOST){
  applyTheme(HOST.theme); HOST.onThemeChange(applyTheme);
  HOST.onBack(() => {
    if(ui.sheets.length){ closeSheet(); return true; }
    if(ui.sel){ ui.sel = null; try{ window.getSelection().removeAllRanges(); }catch(x){} render(); return true; }
    if(ui.view){ ui.view = null; render(); return true; }
    if(ui.tab !== 'files'){ ui.tab = 'files'; render(); return true; }
    return false;
  });
} else {
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  applyTheme(mq && mq.matches ? 'dark' : 'light');
  if(mq && mq.addEventListener) mq.addEventListener('change', ev => applyTheme(ev.matches ? 'dark' : 'light'));
}
render();
if(APP_GEMINI){
  // Back from the app's settings (or any switch back to the page): the key may have been set meanwhile.
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') readAppGemini().then(() => render()); });
}
setTimeout(async () => {
  if(APP_GEMINI){ await readAppGemini(); render(); if(useAppKey()) aiPump(); }
  if(useAppKey()) return;   // the app keeps the model list and makes the requests
  if(!apiKey() || (HOST && !HOST.permissions.has('internet'))) return;
  if(state.settings.model !== 'custom') refreshModels(false).then(() => { if(ui.tab === 'settings' && !ui.view) render(); }).catch(() => {});
  aiPump();
}, 0);

</script>
</body>
</html>
